<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NURA STREAMING</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; 
            outline: none; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #080b11; 
            color: #fff; 
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* 1. CINEMATIC SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #2b0606 0%, #080b11 90%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .splash-logo {
            font-size: 85px;
            font-weight: 900;
            letter-spacing: 7px;
            color: #e50914;
            text-shadow: 0 0 40px rgba(229, 9, 20, 0.8);
            animation: splashZoom 3.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .splash-sub {
            font-size: 14px;
            letter-spacing: 5px;
            color: #00d2ff;
            margin-top: 10px;
            text-transform: uppercase;
            font-weight: 800;
            opacity: 0.9;
        }

        @keyframes splashZoom {
            0% { transform: scale(0.6); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: scale(1.1); opacity: 0.95; }
        }

        /* TOP NAVIGATION */
        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 14px 36px; 
            background: #080b11; 
            border-bottom: 1px solid #162030; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 1.5px; }
        .logo span { color: #00d2ff; }

        .add-btn { 
            background: #00d2ff; 
            color: #06090e; 
            border: 2px solid transparent; 
            padding: 8px 18px; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 13px; 
            cursor: pointer; 
            transition: transform 0.1s ease;
        }
        .add-btn:focus, .add-btn:hover { 
            border-color: #fff !important; 
            box-shadow: 0 0 15px #00d2ff; 
            transform: scale(1.08); 
        }

        /* HERO FEATURE BANNER */
        .hero-banner { 
            width: calc(100% - 72px); 
            margin: 16px auto 24px auto;
            border-radius: 14px;
            height: 200px; 
            background: linear-gradient(180deg, rgba(8,11,17,0.1) 0%, #080b11 95%), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 24px; 
            border: 3px solid transparent;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .hero-banner:focus {
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }
        .hero-tag { color: #00d2ff; font-size: 11px; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; }
        .hero-title { font-size: 26px; font-weight: 900; line-height: 1.2; }
        .hero-title span { color: #e50914; }

        /* 2. NET MIRROR STYLE HORIZONTAL ROWS (CAROUSELS) */
        .row-container {
            margin-bottom: 28px;
            padding: 0 36px;
        }

        .row-header {
            font-size: 17px;
            font-weight: 800;
            color: #e5e5e5;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .row-header span {
            font-size: 11px;
            color: #8fa0b5;
            background: #141b27;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* HORIZONTAL SLIDER */
        .row-slider {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 10px 4px 18px 4px;
            scroll-behavior: smooth;
        }
        .row-slider::-webkit-scrollbar { display: none; }

        /* MOVIE CARD */
        .movie-card {
            flex: 0 0 160px;
            background: #111722;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid transparent;
            position: relative;
            cursor: pointer;
            outline: none;
            transform: translateZ(0);
            transition: transform 0.12s cubic-bezier(0.2, 0, 0.2, 1), border-color 0.12s ease-out, box-shadow 0.12s ease-out;
            will-change: transform;
        }

        @media (max-width: 600px) {
            .navbar, .row-container { padding: 0 16px; }
            .hero-banner { width: calc(100% - 32px); height: 160px; padding: 16px; }
            .movie-card { flex: 0 0 135px; }
            .poster-box { height: 190px !important; }
        }

        /* WHITE FOCUS BORDER (NET MIRROR / NETFLIX STYLE) */
        .movie-card:focus,
        .movie-card:hover {
            transform: scale(1.08) translateY(-4px);
            border-color: #ffffff !important;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.7);
            z-index: 10;
        }

        .poster-box { 
            width: 100%; 
            height: 225px; 
            position: relative; 
            background: #141b26; 
        }
        .poster-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            pointer-events: none; 
        }
        
        .card-badge { 
            position: absolute; 
            top: 6px; 
            left: 6px; 
            background: rgba(0,0,0,0.85); 
            color: #00d2ff; 
            font-size: 9px; 
            font-weight: 800; 
            padding: 2px 5px; 
            border-radius: 4px; 
            border: 1px solid #00d2ff; 
        }
        .card-year { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(0,0,0,0.85); 
            color: #fff; 
            font-size: 9px; 
            font-weight: 700; 
            padding: 2px 5px; 
            border-radius: 4px; 
        }

        .movie-info { 
            padding: 8px; 
            background: #111722;
            text-align: center;
        }
        .movie-name { 
            font-size: 12px; 
            font-weight: 700; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            color: #fff;
        }

        /* PASSWORD MODAL & ADD MODAL */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.88); 
            z-index: 100000; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
        }
        .modal.active { display: flex; }
        .modal-box { 
            background: #111722; 
            width: 100%; 
            max-width: 420px; 
            padding: 22px; 
            border-radius: 12px; 
            border: 1px solid #233044; 
        }
        .modal-box h3 { margin-bottom: 12px; color: #00d2ff; font-size: 16px; }
        .modal-box input, .modal-box select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            background: #080c13; 
            border: 1px solid #253347; 
            color: #fff; 
            border-radius: 6px; 
            font-size: 13px; 
        }
        .modal-box input:focus, .modal-box select:focus { border-color: #00d2ff; }
        
        .file-box { background: #080c13; border: 1px dashed #253347; padding: 10px; border-radius: 6px; margin-bottom: 10px; text-align: center; }
        .file-box label { font-size: 12px; color: #00d2ff; cursor: pointer; }
        .preview-img { width: 65px; height: 90px; object-fit: cover; border-radius: 4px; margin: 6px auto 0; display: none; }
        
        .save-btn { 
            width: 100%; 
            background: #e50914; 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 8px; 
            font-size: 14px; 
        }
        .save-btn:focus { box-shadow: 0 0 12px #fff; }
        .cancel-btn { 
            width: 100%; 
            background: transparent; 
            color: #888; 
            border: 1px solid #253347; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }

        /* TOAST */
        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #e50914;
            color: #fff;
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100000;
        }
    </style>
</head>
<body>

    <!-- 1. CINEMATIC SPLASH INTRO (4 SECONDS) -->
    <div id="splash-screen">
        <div class="splash-logo">NURA</div>
        <div class="splash-sub">Streaming Service</div>
    </div>

    <!-- TOP NAVIGATION -->
    <div class="navbar">
        <div class="logo">NURA <span>OTT</span></div>
        <button class="add-btn" id="btnAddMovie" tabindex="1" onclick="openPasswordModal()">➕ Add Movie</button>
    </div>

    <!-- HERO BANNER -->
    <div class="hero-banner" id="heroBanner" tabindex="2">
        <div class="hero-tag">🔥 4K ULTRA HD STREAMING</div>
        <div class="hero-title">EXPERIENCE <span>CINEMA</span></div>
    </div>

    <!-- 4 DYNAMIC CATEGORY ROWS -->
    <div class="row-container">
        <div class="row-header">🎬 Tamil Movies <span id="count-tamil">0</span></div>
        <div class="row-slider" id="row-tamil"></div>
    </div>

    <div class="row-container">
        <div class="row-header">🎙️ Tamil Dubbed Movies <span id="count-dubbed">0</span></div>
        <div class="row-slider" id="row-dubbed"></div>
    </div>

    <div class="row-container">
        <div class="row-header">🍿 Hollywood Dubbed <span id="count-hollywood">0</span></div>
        <div class="row-slider" id="row-hollywood"></div>
    </div>

    <div class="row-container">
        <div class="row-header">📺 Web Series & Shows <span id="count-series">0</span></div>
        <div class="row-slider" id="row-series"></div>
    </div>

    <div id="toast"></div>

    <!-- PASSWORD MODAL -->
    <div class="modal" id="passModal">
        <div class="modal-box" style="max-width: 320px; text-align: center;">
            <h3>🔒 Admin Security</h3>
            <p style="font-size: 12px; color: #8fa0b5; margin-bottom: 12px;">Enter 6-digit password:</p>
            <input type="password" id="adminPassInput" placeholder="Password" style="text-align: center; font-size: 18px; letter-spacing: 4px;" maxlength="10">
            <button class="save-btn" onclick="verifyAdminPassword()">Unlock</button>
            <button class="cancel-btn" onclick="closePasswordModal()">Cancel</button>
        </div>
    </div>

    <!-- ADD MOVIE MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3>🎬 Add New Title</h3>
            
            <label style="font-size: 11px; color: #888; margin-bottom: 4px; display: block;">Category:</label>
            <select id="mCategory">
                <option value="tamil">🎬 Tamil Movies</option>
                <option value="dubbed">🎙️ Tamil Dubbed</option>
                <option value="hollywood">🍿 Hollywood Dubbed</option>
                <option value="series">📺 Web Series</option>
            </select>

            <input type="text" id="mName" placeholder="Movie Title (e.g. Jana Nayagan)" required>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="mYear" placeholder="Year" value="2024" style="flex: 1;">
                <select id="mQuality" style="flex: 1;">
                    <option value="4K UHD">4K UHD</option>
                    <option value="1080p FHD">1080p FHD</option>
                </select>
            </div>
            
            <div class="file-box">
                <label for="mFile">📁 Choose Poster from Gallery</label>
                <input type="file" id="mFile" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <center><img id="previewImg" class="preview-img"></center>
            </div>
            <input type="text" id="mPoster" placeholder="Or Poster Image URL (Optional)">

            <input type="text" id="mLink" placeholder="Magnet / Torrent Link (magnet:?...)" required>
            <button class="save-btn" onclick="saveMovie()">Save Title</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://nurastream-8f073-default-rtdb.firebaseio.com";
        let allMoviesData = {};
        let uploadedPosterBase64 = "";

        // 4-SECOND CINEMATIC INTRO SOUND (Deep Bass Boom + Chime)
        function playCinematicSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                const bassOsc = ctx.createOscillator();
                const bassGain = ctx.createGain();
                bassOsc.type = 'sine';
                bassOsc.frequency.setValueAtTime(105, ctx.currentTime);
                bassOsc.frequency.exponentialRampToValueAtTime(28, ctx.currentTime + 3.8);

                bassGain.gain.setValueAtTime(1.0, ctx.currentTime);
                bassGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 4.0);

                bassOsc.connect(bassGain);
                bassGain.connect(ctx.destination);
                bassOsc.start();
                bassOsc.stop(ctx.currentTime + 4.0);

                const chimeOsc = ctx.createOscillator();
                const chimeGain = ctx.createGain();
                chimeOsc.type = 'triangle';
                chimeOsc.frequency.setValueAtTime(260, ctx.currentTime);
                chimeOsc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 3.5);

                chimeGain.gain.setValueAtTime(0.3, ctx.currentTime);
                chimeGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.8);

                chimeOsc.connect(chimeGain);
                chimeGain.connect(ctx.destination);
                chimeOsc.start();
                chimeOsc.stop(ctx.currentTime + 3.8);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            playCinematicSound();

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.visibility = 'hidden';
                        // Focus first card in Tamil row on start
                        const firstCard = document.querySelector('#row-tamil .movie-card');
                        if (firstCard) firstCard.focus();
                    }, 600);
                }
            }, 3500);

            loadMovies();
            setupDpadNavigation();
        });

        // 3. ZERO-LAG TV REMOTE D-PAD ENGINE (Left/Right inside Row, Up/Down between Rows)
        function setupDpadNavigation() {
            window.addEventListener('keydown', (e) => {
                const active = document.activeElement;
                if (!active || !active.classList.contains('movie-card')) return;

                const slider = active.parentElement;
                const cardsInRow = Array.from(slider.querySelectorAll('.movie-card'));
                const currentIndex = cardsInRow.indexOf(active);

                // LEFT ARROW (Key 37)
                if (e.keyCode === 37) {
                    if (currentIndex > 0) {
                        e.preventDefault();
                        cardsInRow[currentIndex - 1].focus();
                    }
                }
                // RIGHT ARROW (Key 39)
                else if (e.keyCode === 39) {
                    if (currentIndex < cardsInRow.length - 1) {
                        e.preventDefault();
                        cardsInRow[currentIndex + 1].focus();
                    }
                }
                // UP ARROW (Key 38)
                else if (e.keyCode === 38) {
                    e.preventDefault();
                    const currentRowContainer = slider.closest('.row-container');
                    const prevRowContainer = currentRowContainer.previousElementSibling;

                    if (prevRowContainer && prevRowContainer.classList.contains('row-container')) {
                        const targetSlider = prevRowContainer.querySelector('.row-slider');
                        const targetCards = targetSlider.querySelectorAll('.movie-card');
                        if (targetCards.length > 0) {
                            const targetIndex = Math.min(currentIndex, targetCards.length - 1);
                            targetCards[targetIndex].focus();
                        }
                    } else {
                        document.getElementById('heroBanner').focus();
                    }
                }
                // DOWN ARROW (Key 40)
                else if (e.keyCode === 40) {
                    e.preventDefault();
                    const currentRowContainer = slider.closest('.row-container');
                    const nextRowContainer = currentRowContainer.nextElementSibling;

                    if (nextRowContainer && nextRowContainer.classList.contains('row-container')) {
                        const targetSlider = nextRowContainer.querySelector('.row-slider');
                        const targetCards = targetSlider.querySelectorAll('.movie-card');
                        if (targetCards.length > 0) {
                            const targetIndex = Math.min(currentIndex, targetCards.length - 1);
                            targetCards[targetIndex].focus();
                        }
                    }
                }
            });

            // Down key from Hero Banner goes to first row
            document.getElementById('heroBanner').addEventListener('keydown', (e) => {
                if (e.keyCode === 40) {
                    e.preventDefault();
                    const firstCard = document.querySelector('#row-tamil .movie-card');
                    if (firstCard) firstCard.focus();
                } else if (e.keyCode === 38) {
                    e.preventDefault();
                    document.getElementById('btnAddMovie').focus();
                }
            });

            // Down key from Add Button goes to Hero Banner
            document.getElementById('btnAddMovie').addEventListener('keydown', (e) => {
                if (e.keyCode === 40) {
                    e.preventDefault();
                    document.getElementById('heroBanner').focus();
                }
            });
        }

        // PASSWORD MODAL CONTROLS (420420)
        function openPasswordModal() {
            document.getElementById('adminPassInput').value = '';
            document.getElementById('passModal').classList.add('active');
            setTimeout(() => { document.getElementById('adminPassInput').focus(); }, 150);
        }

        function closePasswordModal() {
            document.getElementById('passModal').classList.remove('active');
        }

        function verifyAdminPassword() {
            const val = document.getElementById('adminPassInput').value.trim();
            if (val === "420420") {
                closePasswordModal();
                openModal();
            } else {
                showToast("❌ Incorrect Password!");
                document.getElementById('adminPassInput').value = '';
                document.getElementById('adminPassInput').focus();
            }
        }

        document.getElementById('adminPassInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifyAdminPassword();
        });

        function openModal() { 
            document.getElementById('addModal').classList.add('active'); 
        }
        function closeModal() { 
            document.getElementById('addModal').classList.remove('active'); 
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    uploadedPosterBase64 = evt.target.result;
                    const preview = document.getElementById('previewImg');
                    preview.src = uploadedPosterBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function fetchAutoPoster(title) {
            try {
                const cleanTitle = title.replace(/\(.*?\)/g, '').trim();
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&media=movie&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x900bb');
                }
            } catch(e) {}
            return "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80";
        }

        async function loadMovies() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/movies.json?nocache=` + Date.now());
                allMoviesData = await res.json() || {};
                renderAllRows();
            } catch (err) {
                console.error(err);
            }
        }

        async function saveMovie() {
            const category = document.getElementById('mCategory').value;
            const name = document.getElementById('mName').value.trim();
            const year = document.getElementById('mYear').value.trim() || '2024';
            const quality = document.getElementById('mQuality').value;
            let poster = uploadedPosterBase64 || document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("Please enter Title and Magnet Link!");
                return;
            }

            if (!poster) {
                poster = await fetchAutoPoster(name);
            }

            const movieId = 'm_' + Date.now();
            const movieData = { id: movieId, category: category || 'tamil', name, year, quality, poster, link, date: Date.now() };

            await fetch(`${FIREBASE_DB_URL}/movies/${movieId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movieData)
            });

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            document.getElementById('previewImg').style.display = 'none';
            uploadedPosterBase64 = "";
            closeModal();
            loadMovies();
            showToast("🎉 Title Added Successfully!");
        }

        async function deleteMovie(id, name) {
            if (confirm(`Do you want to delete "${name}"?`)) {
                await fetch(`${FIREBASE_DB_URL}/movies/${id}.json`, { method: 'DELETE' });
                showToast("Title Deleted.");
                loadMovies();
            }
        }

        function playMovie(magnetLink) {
            if (!magnetLink) return;
            window.location.href = magnetLink.trim();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        // RENDER 4 INDIVIDUAL HORIZONTAL ROWS
        function renderAllRows() {
            const categories = ['tamil', 'dubbed', 'hollywood', 'series'];
            const allList = Object.values(allMoviesData || {}).sort((a,b) => (b.date || 0) - (a.date || 0));

            categories.forEach(cat => {
                const slider = document.getElementById('row-' + cat);
                const countBadge = document.getElementById('count-' + cat);
                slider.innerHTML = '';

                const movies = allList.filter(m => (m.category || 'tamil') === cat);
                countBadge.innerText = `${movies.length} Titles`;

                if (movies.length === 0) {
                    slider.innerHTML = '<div style="color: #556; font-size: 12px; padding: 20px 0;">No titles yet in this category.</div>';
                    return;
                }

                movies.forEach(m => {
                    const magnet = m.link.trim();
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.tabIndex = 0;

                    card.innerHTML = `
                        <div class="poster-box">
                            <span class="card-badge">${m.quality || '4K UHD'}</span>
                            <span class="card-year">${m.year || '2024'}</span>
                            <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80'" loading="lazy">
                        </div>
                        <div class="movie-info">
                            <div class="movie-name">${m.name}</div>
                        </div>
                    `;

                    // Horizontal Smooth Scroll on Focus
                    card.addEventListener('focus', () => {
                        card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    });

                    // 2.5s SAFE LONG PRESS DELETE & INSTANT PLAY ON CLICK
                    let pressTimer = null;
                    let isLongPress = false;

                    const startHold = () => {
                        isLongPress = false;
                        pressTimer = setTimeout(() => {
                            isLongPress = true;
                            deleteMovie(m.id, m.name);
                        }, 2500);
                    };

                    const cancelHold = () => {
                        clearTimeout(pressTimer);
                    };

                    card.addEventListener('mousedown', startHold);
                    card.addEventListener('mouseup', cancelHold);
                    card.addEventListener('touchstart', startHold, { passive: true });
                    card.addEventListener('touchend', cancelHold);

                    card.addEventListener('keydown', (e) => {
                        if (e.keyCode === 13 || e.key === 'Enter') {
                            if (!pressTimer) startHold();
                        }
                    });

                    card.addEventListener('keyup', (e) => {
                        if (e.keyCode === 13 || e.key === 'Enter') {
                            cancelHold();
                            if (!isLongPress) playMovie(magnet);
                        }
                    });

                    card.addEventListener('click', () => {
                        if (!isLongPress) playMovie(magnet);
                    });

                    slider.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
