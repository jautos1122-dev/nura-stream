<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nura TV Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0f12; color: #fff; padding-bottom: 60px; }
        
        /* Navbar */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: rgba(13, 15, 18, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { font-size: 24px; font-weight: 800; color: #e50914; letter-spacing: 1.5px; }
        .logo span { color: #00d2ff; }

        /* Hero Banner */
        .hero { position: relative; height: 260px; background: linear-gradient(180deg, rgba(0,0,0,0.2), #0d0f12), url('https://image.tmdb.org/t/p/original/b33nnKl1GSJbao4l3fZDDqsMx0F.jpg') center/cover no-repeat; display: flex; align-items: flex-end; padding: 20px; }
        .hero-title { font-size: 26px; font-weight: 800; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); }
        .hero-btn { background: #00d2ff; color: #000; font-weight: 700; border: none; padding: 10px 22px; border-radius: 6px; margin-top: 10px; cursor: pointer; }

        /* Sections */
        .section-title { font-size: 18px; font-weight: 700; margin: 24px 20px 12px; color: #00d2ff; display: flex; align-items: center; gap: 8px; }
        .movie-row { display: flex; gap: 14px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; }
        .movie-row::-webkit-scrollbar { display: none; }
        
        .movie-card { min-width: 140px; width: 140px; border-radius: 8px; overflow: hidden; background: #1a1e24; cursor: pointer; transition: transform 0.2s; border: 1px solid #2a313d; }
        .movie-card:active, .movie-card:hover { transform: scale(1.05); border-color: #00d2ff; }
        .movie-card img { width: 100%; height: 200px; object-fit: cover; background: #111; }
        .movie-info { padding: 8px; }
        .movie-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-sub { font-size: 11px; color: #00d2ff; margin-top: 2px; }

        /* Video Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .modal video { width: 95%; max-width: 800px; border-radius: 8px; }
        .close-btn { align-self: flex-end; margin-right: 5%; color: #fff; font-size: 32px; cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NURA <span>STREAM</span></div>
    </div>

    <div class="hero">
        <div>
            <div class="hero-title">GOAT - The Greatest Of All Time</div>
            <button class="hero-btn" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">▶ Play Now</button>
        </div>
    </div>

    <!-- Row 1: New Tamil Movies -->
    <div class="section-title">🔥 Trending Tamil Movies (புதிய படங்கள்)</div>
    <div class="movie-row">
        
        <div class="movie-card" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
            <img src="https://image.tmdb.org/t/p/w500/b33nnKl1GSJbao4l3fZDDqsMx0F.jpg" alt="GOAT">
            <div class="movie-info">
                <div class="movie-title">The GOAT (2024)</div>
                <div class="movie-sub">Tamil • 4K HDR</div>
            </div>
        </div>

        <div class="movie-card" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">
            <img src="https://image.tmdb.org/t/p/w500/pA34V3Y4Z3Yv2B6v6v2n2v2v2.jpg" onerror="this.src='https://m.media-amazon.com/images/M/MV5BMjA5MjYwMTEtNjBkYS00NTg4LWIxZTUtNjY3MGQ4M2Q1NDVjXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg'" alt="Amaran">
            <div class="movie-info">
                <div class="movie-title">Amaran (2024)</div>
                <div class="movie-sub">Tamil • 1080p HD</div>
            </div>
        </div>

        <div class="movie-card" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4')">
            <img src="https://m.media-amazon.com/images/M/MV5BNGQxNDgzZWQtZTNjNi00M2NmLWExMTgtOTY4NjA4ZDcxN2Q5XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg'" alt="Maharaja">
            <div class="movie-info">
                <div class="movie-title">Maharaja</div>
                <div class="movie-sub">Tamil • 1080p HD</div>
            </div>
        </div>

    </div>

    <!-- Row 2: Tamil Dubbed -->
    <div class="section-title">🎙️ Tamil Dubbed Movies</div>
    <div class="movie-row">

        <div class="movie-card" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4')">
            <img src="https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg" alt="Deadpool">
            <div class="movie-info">
                <div class="movie-title">Deadpool & Wolverine</div>
                <div class="movie-sub">Tamil Dub • 4K</div>
            </div>
        </div>

        <div class="movie-card" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyBlazes.mp4')">
            <img src="https://m.media-amazon.com/images/M/MV5BNmU5OTQzYjctM2M0Ni00OTZkLWE1MjktMTJmNDYxYmU5NjY5XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Kalki">
            <div class="movie-info">
                <div class="movie-title">Kalki 2898 AD</div>
                <div class="movie-sub">Tamil Dub • 1080p</div>
            </div>
        </div>

    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <span class="close-btn" onclick="closeVideo()">&times;</span>
        <video id="player" controls playsinline></video>
    </div>

    <script>
        function playVideo(url) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('player');
            player.src = url;
            modal.style.display = 'flex';
            player.play().catch(e => console.log(e));
        }

        function closeVideo() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('player');
            player.pause();
            player.src = '';
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
