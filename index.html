<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA STREAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        
        /* Navbar */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #07090c; border-bottom: 1px solid #1a2230; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 2px; }
        .logo span { color: #00d2ff; }

        /* Headings */
        .section-title { font-size: 17px; font-weight: 700; margin: 24px 16px 12px; color: #00d2ff; display: flex; align-items: center; gap: 8px; }
        
        /* Movie Scroller */
        .movie-row { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
        .movie-row::-webkit-scrollbar { display: none; }
        
        .movie-card { min-width: 145px; width: 145px; background: #131a24; border-radius: 10px; overflow: hidden; border: 1px solid #232d3d; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; }
        .movie-card:active { transform: scale(0.96); }
        .poster-box { width: 100%; height: 210px; background: #1a2332; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .play-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(0, 210, 255, 0.9); color: #000; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
        
        .movie-info { padding: 10px; }
        .movie-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .movie-sub { font-size: 11px; color: #00d2ff; margin-top: 4px; font-weight: 600; }

        /* Video Player Layer */
        .player-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .player-container.active { display: flex; }
        .video-box { width: 100%; max-width: 900px; background: #000; position: relative; }
        video { width: 100%; height: auto; max-height: 80vh; display: block; }
        
        .close-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #111; }
        .playing-title { font-size: 15px; font-weight: bold; color: #00d2ff; }
        .btn-close { background: #e50914; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NURA <span>STREAM</span></div>
    </div>

    <!-- Section 1: Tamil Movies -->
    <div class="section-title">🔥 Trending Tamil Movies (புதிய படங்கள்)</div>
    <div class="movie-row">
        
        <!-- Movie 1 -->
        <div class="movie-card" onclick="startMovie('The GOAT (2024)', 'https://vjs.zencdn.net/v/oceans.mp4')">
            <div class="poster-box">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=400&q=80" alt="GOAT">
                <span class="play-tag">▶ 4K</span>
            </div>
            <div class="movie-info">
                <div class="movie-title">The GOAT (2024)</div>
                <div class="movie-sub">Tamil • 4K HDR</div>
            </div>
        </div>

        <!-- Movie 2 -->
        <div class="movie-card" onclick="startMovie('Amaran (2024)', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4')">
            <div class="poster-box">
                <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=400&q=80" alt="Amaran">
                <span class="play-tag">▶ 1080p</span>
            </div>
            <div class="movie-info">
                <div class="movie-title">Amaran (2024)</div>
                <div class="movie-sub">Tamil • 1080p HD</div>
            </div>
        </div>

        <!-- Movie 3 -->
        <div class="movie-card" onclick="startMovie('Maharaja', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
            <div class="poster-box">
                <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80" alt="Maharaja">
                <span class="play-tag">▶ HD</span>
            </div>
            <div class="movie-info">
                <div class="movie-title">Maharaja</div>
                <div class="movie-sub">Tamil • 1080p HD</div>
            </div>
        </div>

    </div>

    <!-- Section 2: Tamil Dubbed Movies -->
    <div class="section-title">🎙️ Tamil Dubbed Movies</div>
    <div class="movie-row">

        <!-- Dubbed 1 -->
        <div class="movie-card" onclick="startMovie('Deadpool & Wolverine', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')">
            <div class="poster-box">
                <img src="https://images.unsplash.com/photo-1509281373149-e957c6296406?auto=format&fit=crop&w=400&q=80" alt="Deadpool">
                <span class="play-tag">▶ 4K</span>
            </div>
            <div class="movie-info">
                <div class="movie-title">Deadpool & Wolverine</div>
                <div class="movie-sub">Tamil Dub • 4K</div>
            </div>
        </div>

        <!-- Dubbed 2 -->
        <div class="movie-card" onclick="startMovie('Kalki 2898 AD', 'https://vjs.zencdn.net/v/oceans.mp4')">
            <div class="poster-box">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" alt="Kalki">
                <span class="play-tag">▶ 1080p</span>
            </div>
            <div class="movie-info">
                <div class="movie-title">Kalki 2898 AD</div>
                <div class="movie-sub">Tamil Dub • 1080p</div>
            </div>
        </div>

    </div>

    <!-- Dedicated Fullscreen Video Player -->
    <div class="player-container" id="videoContainer">
        <div class="close-bar">
            <span class="playing-title" id="nowPlaying">Playing...</span>
            <button class="btn-close" onclick="closeMovie()">✕ Close</button>
        </div>
        <div class="video-box">
            <video id="mainVideo" controls playsinline preload="auto"></video>
        </div>
    </div>

    <script>
        const container = document.getElementById('videoContainer');
        const video = document.getElementById('mainVideo');
        const titleElem = document.getElementById('nowPlaying');

        function startMovie(title, url) {
            titleElem.innerText = "Now Playing: " + title;
            video.src = url;
            container.classList.add('active');
            video.load();
            video.play().catch(function(err) {
                console.log("Autoplay blocked, user click required", err);
            });
        }

        function closeMovie() {
            video.pause();
            video.src = '';
            container.classList.remove('active');
        }
    </script>
</body>
</html>
