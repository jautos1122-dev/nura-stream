<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NURA STREAMING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; }
        body { background: #06090e; color: #fff; padding-bottom: 50px; }

        /* Top Bar */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(6, 9, 14, 0.95); border-bottom: 1px solid #162030; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo { font-size: 20px; font-weight: 900; color: #e50914; letter-spacing: 1.5px; }
        .logo span { color: #00d2ff; }
        .add-btn { background: #e50914; color: #fff; border: none; padding: 9px 15px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }

        /* Full Hero Banner */
        .hero-banner { width: 100%; height: 210px; background: linear-gradient(180deg, rgba(6,9,14,0.3) 0%, #06090e 100%), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; }
        .hero-tag { color: #00d2ff; font-size: 10px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
        .hero-title { font-size: 22px; font-weight: 900; line-height: 1.2; margin-bottom: 6px; }
        .hero-title span { color: #e50914; }

        /* Main Catalog */
        .catalog-title { font-size: 16px; font-weight: 800; margin: 16px 18px 12px; display: flex; justify-content: space-between; align-items: center; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 14px; padding: 0 16px; }

        /* Movie Card */
        .movie-card { background: #111722; border-radius: 10px; overflow: hidden; border: 1px solid #1c2637; position: relative; }
        .poster-box { width: 100%; height: 210px; position: relative; background: #162030; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #00d2ff; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; border: 1px solid #00d2ff; }
        .card-year { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85); color: #fff; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
        .delete-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(229,9,20,0.9); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; cursor: pointer; }

        .movie-info { padding: 10px; }
        .movie-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
        .play-btn { width: 100%; background: #6c5ce7; color: #fff; border: none; padding: 8px 0; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-box { background: #111722; width: 100%; max-width: 440px; padding: 20px; border-radius: 10px; border: 1px solid #233044; }
        .modal-box h3 { margin-bottom: 12px; color: #00d2ff; font-size: 16px; }
        .modal-box input, .modal-box select { width: 100%; padding: 11px; margin-bottom: 10px; background: #080c13; border: 1px solid #253347; color: #fff; border-radius: 6px; font-size: 13px; outline: none; }
        .file-box { background: #080c13; border: 1px dashed #253347; padding: 10px; border-radius: 6px; margin-bottom: 10px; text-align: center; }
        .file-box label { font-size: 12px; color: #00d2ff; cursor: pointer; }
        .preview-img { width: 70px; height: 95px; object-fit: cover; border-radius: 4px; margin: 6px auto 0; display: none; }
        .save-btn { width: 100%; background: #e50914; color: #fff; border: none; padding: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 6px; }
        .cancel-btn { width: 100%; background: transparent; color: #777; border: 1px solid #253347; padding: 9px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NURA <span>STREAMING</span></div>
        <button class="add-btn" onclick="openModal()">➕ Add Movie</button>
    </div>

    <!-- Perfect Fit Banner -->
    <div class="hero-banner">
        <div class="hero-tag">🔥 4K ULTRA HD CINEMA</div>
        <div class="hero-title">EXPERIENCE <span>CINEMA</span></div>
    </div>

    <div class="catalog-title">
        <span>🎬 Latest Movies (Stremio Direct)</span>
        <span id="movieCount" style="font-size: 12px; color: #888;">0 Titles</span>
    </div>

    <div class="movie-grid" id="movieContainer">
        <div style="grid-column: 1/-1; text-align: center; color: #667; padding: 40px;">லோட் ஆகிறது...</div>
    </div>

    <!-- Modal -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3>🎬 புதிய படம் சேர்க்க</h3>
            <input type="text" id="mName" placeholder="படத்தின் பெயர் (எ.கா: Jana Nayagan)" required>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="mYear" placeholder="வருடம்" value="2024" style="flex: 1;">
                <select id="mQuality" style="flex: 1;">
                    <option value="4K UHD">4K UHD</option>
                    <option value="1080p FHD">1080p FHD</option>
                </select>
            </div>
            
            <div class="file-box">
                <label for="mFile">📁 Choose Poster from Gallery</label>
                <input type="file" id="mFile" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <center><img id="previewImg" class="preview-img"></center>
            </div>
            <input type="text" id="mPoster" placeholder="அல்லது போஸ்டர் லிங்க் (Optional)">

            <input type="text" id="mLink" placeholder="TamilMV Magnet Link (magnet:?...)" required>
            <button class="save-btn" onclick="saveMovie()">Save Movie</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://nurastream-8f073-default-rtdb.firebaseio.com";
        let uploadedPosterBase64 = "";

        function openModal() { document.getElementById('addModal').classList.add('active'); }
        function closeModal() { document.getElementById('addModal').classList.remove('active'); }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    uploadedPosterBase64 = evt.target.result;
                    const preview = document.getElementById('previewImg');
                    preview.src = uploadedPosterBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function fetchAutoPoster(title) {
            try {
                const cleanTitle = title.replace(/\(.*?\)/g, '').trim();
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&media=movie&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x900bb');
                }
            } catch(e) {}
            return "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80";
        }

        async function loadMovies() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/movies.json`);
                const data = await res.json();
                render(data);
            } catch (err) {}
        }

        async function saveMovie() {
            const name = document.getElementById('mName').value.trim();
            const year = document.getElementById('mYear').value.trim() || '2024';
            const quality = document.getElementById('mQuality').value;
            let poster = uploadedPosterBase64 || document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("பெயர் மற்றும் Magnet Link உள்ளிடவும்!");
                return;
            }

            if (!poster) {
                poster = await fetchAutoPoster(name);
            }

            const movieId = 'm_' + Date.now();
            const movieData = { id: movieId, name, year, quality, poster, link, date: Date.now() };

            await fetch(`${FIREBASE_DB_URL}/movies/${movieId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movieData)
            });

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            document.getElementById('previewImg').style.display = 'none';
            uploadedPosterBase64 = "";
            closeModal();
            loadMovies();
        }

        async function deleteMovie(id) {
            if (confirm("நீக்கவா?")) {
                await fetch(`${FIREBASE_DB_URL}/movies/${id}.json`, { method: 'DELETE' });
                loadMovies();
            }
        }

        function playMovie(magnetLink) {
            window.location.href = magnetLink.trim();
        }

        function render(data) {
            const container = document.getElementById('movieContainer');
            const countElem = document.getElementById('movieCount');
            container.innerHTML = '';

            if (!data) {
                countElem.innerText = "0 Titles";
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #667; padding: 40px;">படங்கள் சேர்க்கப்படவில்லை. "➕ Add Movie" மூலம் சேர்க்கவும்!</div>';
                return;
            }

            const list = Object.values(data).sort((a,b) => (b.date || 0) - (a.date || 0));
            countElem.innerText = `${list.length} Titles`;

            list.forEach(m => {
                const magnet = m.link.trim();
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <span class="card-badge">${m.quality || '4K UHD'}</span>
                        <span class="card-year">${m.year || '2024'}</span>
                        <button class="delete-btn" onclick="deleteMovie('${m.id}')">✕</button>
                        <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80'">
                    </div>
                    <div class="movie-info">
                        <div class="movie-name">${m.name}</div>
                        <button class="play-btn" onclick="playMovie('${magnet.replace(/'/g, "\\'")}')">▶ Play Now</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadMovies();
    </script>
</body>
</html>
