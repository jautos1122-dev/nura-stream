<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA STREAM - Stremio OTT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; }
        body { background: #07090e; color: #fff; padding-bottom: 90px; }

        /* Top Bar */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(7, 9, 14, 0.95); border-bottom: 2px solid #6c5ce7; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px); }
        .logo { font-size: 20px; font-weight: 900; color: #e50914; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        .logo span { color: #00d2ff; }
        .ver-badge { background: #6c5ce7; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; letter-spacing: 1px; }
        .add-btn { background: #e50914; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .add-btn:hover { background: #ff1e2b; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-box { background: #111722; width: 100%; max-width: 460px; padding: 24px; border-radius: 12px; border: 1px solid #6c5ce7; }
        .modal-box h3 { margin-bottom: 14px; color: #00d2ff; font-size: 17px; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 12px; background: #080c13; border: 1px solid #253347; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
        .modal-box .save-btn { width: 100%; background: #6c5ce7; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .modal-box .cancel-btn { width: 100%; background: transparent; color: #888; border: 1px solid #253347; padding: 10px; border-radius: 8px; cursor: pointer; }

        /* Movie Grid */
        .section-title { font-size: 18px; font-weight: 800; margin: 20px 20px 14px; color: #dfe6e9; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 16px; padding: 0 20px; }

        .movie-card { background: #111722; border-radius: 12px; overflow: hidden; border: 1px solid #1c2637; position: relative; transition: 0.2s; }
        .movie-card:hover { transform: translateY(-4px); border-color: #6c5ce7; }
        .poster-box { width: 100%; height: 220px; background: #162030; position: relative; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }

        .badge-4k { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #00d2ff; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; border: 1px solid #00d2ff; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.85); color: #ff4757; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 26px; height: 26px; font-weight: bold; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }

        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }

        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .play-stremio { display: block; width: 100%; background: #6c5ce7; color: #fff; text-align: center; text-decoration: none; padding: 10px 0; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
        .play-stremio:hover { background: #5641e5; }
        .copy-btn { width: 100%; background: #1c2637; color: #00d2ff; border: 1px solid #28374d; padding: 7px 0; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">
            NURA <span>STREAM</span>
            <span class="ver-badge">⚡ STREMIO DIRECT</span>
        </div>
        <button class="add-btn" onclick="openModal()">➕ Add Movie</button>
    </div>

    <!-- Modal -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3>🎬 புதிய படம் சேர்க்க</h3>
            <input type="text" id="mName" placeholder="படத்தின் பெயர் (எ.கா: Jana Nayagan)" required>
            <input type="text" id="mPoster" placeholder="போஸ்டர் லிங்க் (ஆப்ஷனல்)">
            <input type="text" id="mLink" placeholder="TamilMV Magnet Link (magnet:?...)" required>
            <button class="save-btn" onclick="saveMovie()">Save Movie</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <div class="section-title">🔥 My OTT Movies</div>
    <div class="movie-grid" id="movieContainer">
        <div style="grid-column: 1/-1; text-align: center; color: #667; padding: 50px;">படங்கள் லோட் ஆகிறது...</div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://nurastream-8f073-default-rtdb.firebaseio.com";

        function openModal() { document.getElementById('addModal').classList.add('active'); }
        function closeModal() { document.getElementById('addModal').classList.remove('active'); }

        async function fetchAutoPoster(title) {
            try {
                const cleanTitle = title.replace(/\(.*?\)/g, '').trim();
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&media=movie&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x900bb');
                }
            } catch(e) {}
            return "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80";
        }

        async function loadMovies() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/movies.json`);
                const data = await res.json();
                render(data);
            } catch (err) {
                console.log("Error loading movies:", err);
            }
        }

        async function saveMovie() {
            const name = document.getElementById('mName').value.trim();
            let poster = document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("படத்தின் பெயர் மற்றும் Magnet Link உள்ளிடவும்!");
                return;
            }

            if (!poster) {
                poster = await fetchAutoPoster(name);
            }

            const movieId = 'm_' + Date.now();
            const movieData = { id: movieId, name, poster, link, date: Date.now() };

            await fetch(`${FIREBASE_DB_URL}/movies/${movieId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movieData)
            });

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            closeModal();
            loadMovies();
        }

        async function deleteMovie(id) {
            if (confirm("இந்தப் படத்தை நீக்கவா?")) {
                await fetch(`${FIREBASE_DB_URL}/movies/${id}.json`, { method: 'DELETE' });
                loadMovies();
            }
        }

        // 100% Working 1-Click Launch directly into Stremio Android App
        function launchStremio(magnetLink) {
            const cleanMagnet = magnetLink.trim();
            
            // Direct Android Intent targeting Stremio App directly
            const stremioIntent = `intent:${cleanMagnet}#Intent;package=com.stremio.one;action=android.intent.action.VIEW;end;`;
            
            // Fallback Protocol
            const stremioProtocol = cleanMagnet.replace('magnet:', 'stremio:');

            try {
                window.location.href = stremioIntent;
            } catch(e) {
                window.location.href = stremioProtocol;
            }
        }

        function copyMagnet(magnetLink) {
            navigator.clipboard.writeText(magnetLink).then(() => {
                alert("Magnet Link Copied! Stremio Search-ல் Paste செய்து கொள்ளலாம்.");
            }).catch(() => {
                prompt("Copy Magnet Link:", magnetLink);
            });
        }

        function render(data) {
            const container = document.getElementById('movieContainer');
            container.innerHTML = '';

            if (!data) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #667; padding: 50px;">படங்கள் எதுவும் இல்லை. "➕ Add Movie" மூலம் TamilMV Magnet Link-ஐ சேர்க்கவும்!</div>';
                return;
            }

            const list = Object.values(data).sort((a,b) => (b.date || 0) - (a.date || 0));

            list.forEach(m => {
                const magnet = m.link.trim();
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <span class="badge-4k">4K UHD</span>
                        <button class="delete-btn" onclick="deleteMovie('${m.id}')">✕</button>
                        <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80'">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${m.name}</div>
                        <div class="btn-group">
                            <button class="play-stremio" onclick="launchStremio('${magnet.replace(/'/g, "\\'")}')">▶ Play in Stremio</button>
                            <button class="copy-btn" onclick="copyMagnet('${magnet.replace(/'/g, "\\'")}')">📋 Copy Magnet</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadMovies();
    </script>
</body>
</html>
