<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA STREAM - Auto Movies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding-bottom: 80px; }
        
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #07090c; border-bottom: 1px solid #1a2230; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 2px; }
        .logo span { color: #00d2ff; }

        .section-title { font-size: 17px; font-weight: 700; margin: 24px 16px 12px; color: #00d2ff; }
        .movie-row { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
        .movie-row::-webkit-scrollbar { display: none; }
        
        .movie-card { min-width: 145px; width: 145px; background: #131a24; border-radius: 10px; overflow: hidden; border: 1px solid #232d3d; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; }
        .movie-card:active { transform: scale(0.96); }
        .poster-box { width: 100%; height: 210px; background: #1a2332; position: relative; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }
        .play-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(0, 210, 255, 0.9); color: #000; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; }
        
        .movie-info { padding: 8px; }
        .movie-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-sub { font-size: 11px; color: #00d2ff; margin-top: 3px; }

        /* Video Player */
        .player-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .player-container.active { display: flex; }
        .video-box { width: 100%; max-width: 900px; background: #000; }
        video { width: 100%; max-height: 75vh; }
        .close-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #111; }
        .playing-title { font-size: 14px; font-weight: bold; color: #00d2ff; }
        .btn-close { background: #e50914; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NURA <span>STREAM</span></div>
    </div>

    <!-- Container 1 -->
    <div class="section-title">🔥 Tamil Movies (புதிய படங்கள்)</div>
    <div class="movie-row" id="tamilContainer">
        <p style="padding: 10px; color: #777;">Loading latest movies...</p>
    </div>

    <!-- Container 2 -->
    <div class="section-title">🎙️ Tamil Dubbed Movies</div>
    <div class="movie-row" id="dubbedContainer">
        <p style="padding: 10px; color: #777;">Loading dubbed movies...</p>
    </div>

    <!-- Video Modal -->
    <div class="player-container" id="videoContainer">
        <div class="close-bar">
            <span class="playing-title" id="nowPlaying">Playing...</span>
            <button class="btn-close" onclick="closeMovie()">✕ Close</button>
        </div>
        <div class="video-box">
            <video id="mainVideo" controls playsinline></video>
        </div>
    </div>

    <script>
        // movies.json-லிருந்து தானாகப் படங்களை லோட் செய்யும் ஸ்கிரிப்ட்
        fetch('movies.json')
            .then(res => res.json())
            .then(data => {
                renderMovies(data.tamil, 'tamilContainer');
                renderMovies(data.dubbed, 'dubbedContainer');
            })
            .catch(err => {
                console.log('Fallback to local storage', err);
            });

        function renderMovies(list, containerId) {
            const container = document.getElementById(containerId);
            if (!list || list.length === 0) return;
            container.innerHTML = '';
            list.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => startMovie(m.title, m.stream);
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${m.poster}" alt="${m.title}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=400&q=80'">
                        <span class="play-tag">▶ Play</span>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${m.title}</div>
                        <div class="movie-sub">${m.quality}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        const playerBox = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const nowPlaying = document.getElementById('nowPlaying');

        function startMovie(title, url) {
            nowPlaying.innerText = "Playing: " + title;
            mainVideo.src = url;
            playerBox.classList.add('active');
            mainVideo.play().catch(e => console.log(e));
        }

        function closeMovie() {
            mainVideo.pause();
            mainVideo.src = '';
            playerBox.classList.remove('active');
        }
    </script>
</body>
</html>
