 <!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA STREAM - Premium OTT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif; }
        body { background: #07090e; color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        /* Top Bar */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: rgba(7, 9, 14, 0.95); border-bottom: 1px solid #161f2e; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px); }
        .logo { font-size: 24px; font-weight: 900; color: #e50914; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: #00d2ff; }
        .add-btn { background: linear-gradient(135deg, #e50914, #b80610); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }

        /* Hero */
        .hero { margin: 18px 20px; padding: 26px 20px; border-radius: 14px; background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 100%), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover; border: 1px solid #1f2b3e; }
        .hero h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .hero p { color: #a0aec0; font-size: 13px; }

        /* Modal Add Movie */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-box { background: #111722; width: 100%; max-width: 480px; padding: 24px; border-radius: 14px; border: 1px solid #233044; }
        .modal-box h3 { margin-bottom: 16px; color: #00d2ff; font-size: 18px; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 14px; background: #080c13; border: 1px solid #253347; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
        .modal-box .save-btn { width: 100%; background: #e50914; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 8px; }
        .modal-box .cancel-btn { width: 100%; background: transparent; color: #888; border: 1px solid #253347; padding: 10px; border-radius: 8px; cursor: pointer; }

        /* Movie Row / Grid */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 24px 20px 14px; }
        .section-title { font-size: 19px; font-weight: 800; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 0 20px; }

        .movie-card { background: #111722; border-radius: 12px; overflow: hidden; border: 1px solid #1c2637; position: relative; }
        .poster-box { width: 100%; height: 235px; background: #162030; position: relative; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }

        .badge-4k { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); color: #00d2ff; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; border: 1px solid #00d2ff; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.75); color: #ff4757; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 26px; height: 26px; font-weight: bold; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }

        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
        .movie-meta { font-size: 11px; color: #8899a6; display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        .play-btn { display: block; width: 100%; background: #e50914; color: #fff; text-align: center; text-decoration: none; border: none; padding: 10px 0; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .play-btn:hover { background: #ff1e2b; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NURA <span>STREAM</span></div>
        <button class="add-btn" onclick="openModal()">➕ Add Movie</button>
    </div>

    <div class="hero">
        <h1>Nura Stream OTT</h1>
        <p>TamilMV டோரண்ட் படங்கள் நேரடியாக தியேட்டர் 4K தரத்தில் பஃபரிங் இல்லாமல் உடனே ஓடும்.</p>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3>🎬 புதிய படம் சேர்க்க</h3>
            <input type="text" id="mName" placeholder="படத்தின் பெயர் (எ.கா: Jana Nayagan)" required>
            <input type="text" id="mPoster" placeholder="போஸ்டர் லிங்க் (ஆப்ஷனல்)">
            <input type="text" id="mLink" placeholder="TamilMV Magnet Link (magnet:?...)" required>
            <button class="save-btn" onclick="saveMovie()">Save to Library</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <div class="section-header">
        <div class="section-title">🔥 My Movies</div>
    </div>
    <div class="movie-grid" id="movieContainer">
        <div style="grid-column: 1/-1; text-align: center; color: #667; padding: 50px;">படங்கள் லோட் ஆகிறது...</div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://nurastream-8f073-default-rtdb.firebaseio.com";

        function openModal() { document.getElementById('addModal').classList.add('active'); }
        function closeModal() { document.getElementById('addModal').classList.remove('active'); }

        async function fetchAutoPoster(title) {
            try {
                const cleanTitle = title.replace(/\(.*?\)/g, '').trim();
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&media=movie&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x900bb');
                }
            } catch(e) {}
            return "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80";
        }

        async function loadMovies() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/movies.json`);
                const data = await res.json();
                render(data);
            } catch (err) {
                console.log("Error loading movies:", err);
            }
        }

        async function saveMovie() {
            const name = document.getElementById('mName').value.trim();
            let poster = document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("படத்தின் பெயர் மற்றும் Magnet Link உள்ளிடவும்!");
                return;
            }

            if (!poster) {
                poster = await fetchAutoPoster(name);
            }

            const movieId = 'm_' + Date.now();
            const movieData = { id: movieId, name, poster, link, date: Date.now() };

            await fetch(`${FIREBASE_DB_URL}/movies/${movieId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movieData)
            });

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            closeModal();
            loadMovies();
        }

        async function deleteMovie(id) {
            if (confirm("இந்தப் படத்தை நீக்கவா?")) {
                await fetch(`${FIREBASE_DB_URL}/movies/${id}.json`, { method: 'DELETE' });
                loadMovies();
            }
        }

        function render(data) {
            const container = document.getElementById('movieContainer');
            container.innerHTML = '';

            if (!data) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #667; padding: 50px;">இன்னும் படங்கள் எதுவும் சேர்க்கப்படவில்லை. மேலே உள்ள "➕ Add Movie" மூலம் புதிய படத்தை சேர்க்கவும்!</div>';
                return;
            }

            const list = Object.values(data).sort((a,b) => (b.date || 0) - (a.date || 0));

            list.forEach(m => {
                const magnet = m.link.trim();
                const directTorrLink = `http://127.0.0.1:8090/stream?link=${encodeURIComponent(magnet)}&play=1`;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <span class="badge-4k">4K UHD</span>
                        <button class="delete-btn" onclick="deleteMovie('${m.id}')">✕</button>
                        <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80'">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${m.name}</div>
                        <div class="movie-meta">
                            <span>Tamil • Movie</span>
                            <span style="color:#00d2ff;">★ 9.8</span>
                        </div>
                        <a class="play-btn" href="${directTorrLink}">▶ Watch Now (4K)</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadMovies();
    </script>
</body>
</html>
