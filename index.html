<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA STREAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding-bottom: 80px; }
        
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #07090c; border-bottom: 1px solid #1a2230; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 2px; }
        .logo span { color: #00d2ff; }
        .nav-actions { display: flex; gap: 8px; }
        .btn-nav { background: #00d2ff; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-sync { background: #22c55e; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }

        .form-box { display: none; background: #131a24; padding: 18px; margin: 16px; border-radius: 10px; border: 1px solid #232d3d; }
        .form-box.active { display: block; }
        .form-box h3 { margin-bottom: 14px; color: #00d2ff; font-size: 16px; }
        .form-box input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0b0e14; border: 1px solid #2a3547; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        .form-box .submit-btn { width: 100%; background: #e50914; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }

        .section-title { font-size: 17px; font-weight: 700; margin: 20px 16px 12px; color: #00d2ff; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding: 0 16px; }
        
        .movie-card { background: #131a24; border-radius: 10px; overflow: hidden; border: 1px solid #232d3d; position: relative; }
        .poster-box { width: 100%; height: 200px; background: #1a2332; position: relative; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .delete-btn { position: absolute; top: 6px; right: 6px; background: rgba(229, 9, 20, 0.85); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; font-size: 13px; cursor: pointer; z-index: 10; }
        
        .movie-info { padding: 8px 10px; }
        .movie-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .btn-mx { background: #0084ff; color: #fff; text-align: center; text-decoration: none; font-size: 12px; font-weight: bold; padding: 8px 0; border-radius: 6px; display: block; border: none; cursor: pointer; }
        .btn-vlc { background: #ff7700; color: #fff; text-align: center; text-decoration: none; font-size: 12px; font-weight: bold; padding: 6px 0; border-radius: 6px; display: block; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NURA <span>STREAM</span></div>
        <div class="nav-actions">
            <button class="btn-sync" onclick="loadSharedMovies()">🔄 Sync TV</button>
            <button class="btn-nav" onclick="toggleForm()">➕ Add</button>
        </div>
    </div>

    <!-- Movie Add Form -->
    <div class="form-box" id="movieForm">
        <h3>🎬 புதிய படத்தை சேர்க்க (டிவி & மொபைல்)</h3>
        <input type="text" id="mName" placeholder="படத்தின் பெயர் (எ.கா: Leo, Amaran, GOAT)" required>
        <input type="text" id="mPoster" placeholder="போஸ்டர் இமேஜ் லிங்க் (ஆப்ஷனல்)">
        <input type="text" id="mLink" placeholder="TamilMV Video / Stream / Magnet Link" required>
        <button class="submit-btn" onclick="addNewMovie()">Save & Sync to TV</button>
    </div>

    <div class="section-title">🍿 My Movies (MX Player / VLC)</div>
    <div class="movie-grid" id="movieContainer">
        <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 30px;">படங்கள் லோட் ஆகிறது...</div>
    </div>

    <script>
        const CLOUD_STORAGE = "https://api.npoint.io/46985dfc1d044f56fce2";

        function toggleForm() {
            document.getElementById('movieForm').classList.toggle('active');
        }

        async function loadSharedMovies() {
            const container = document.getElementById('movieContainer');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #00d2ff; padding: 30px;">டிவி படங்களை சிங்க் செய்கிறது...</div>';
            
            try {
                const res = await fetch(CLOUD_STORAGE);
                if (res.ok) {
                    const list = await res.json();
                    if (Array.isArray(list)) {
                        localStorage.setItem('nura_movies_final', JSON.stringify(list));
                        render(list);
                        return;
                    }
                }
            } catch (e) {
                console.log("Using Local DB");
            }

            const saved = localStorage.getItem('nura_movies_final');
            render(saved ? JSON.parse(saved) : []);
        }

        async function addNewMovie() {
            const name = document.getElementById('mName').value.trim();
            let poster = document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("படத்தின் பெயர் மற்றும் Link உள்ளிடவும்!");
                return;
            }

            if (!poster) {
                poster = "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80";
            }

            const saved = localStorage.getItem('nura_movies_final');
            let movies = saved ? JSON.parse(saved) : [];
            movies.unshift({ id: Date.now(), name: name, poster: poster, link: link });

            localStorage.setItem('nura_movies_final', JSON.stringify(movies));
            render(movies);

            // Sync to Cloud for TV
            try {
                await fetch(CLOUD_STORAGE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(movies)
                });
            } catch (err) {
                console.log(err);
            }

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            toggleForm();
        }

        async function deleteMovie(id) {
            if (confirm("இந்தப் படத்தை நீக்கவா?")) {
                const saved = localStorage.getItem('nura_movies_final');
                let movies = saved ? JSON.parse(saved) : [];
                movies = movies.filter(m => m.id !== id);
                localStorage.setItem('nura_movies_final', JSON.stringify(movies));
                render(movies);

                try {
                    await fetch(CLOUD_STORAGE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(movies)
                    });
                } catch (err) {}
            }
        }

        function playInMX(link) {
            // Opens directly in MX Player on Android / Android TV
            if (link.startsWith('http://') || link.startsWith('https://')) {
                window.location.href = `intent:${link}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end`;
            } else {
                // Magnet / Torrent Links
                window.location.href = link;
            }
        }

        function render(movies) {
            const container = document.getElementById('movieContainer');
            container.innerHTML = '';

            if (!movies || movies.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 10px;">படங்கள் எதுவும் இல்லை. மொபைலில் "➕ Add" கொடுத்தால் டிவியிலும் உடனே வரும்!</div>';
                return;
            }

            movies.forEach(m => {
                const vlcUrl = m.link.startsWith('magnet:') ? m.link : "vlc://" + m.link;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteMovie(${m.id})">✕</button>
                    <div class="poster-box">
                        <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80'">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${m.name}</div>
                        <div class="btn-group">
                            <button class="btn-mx" onclick="playInMX('${m.link.replace(/'/g, "\\'")}')">▶ Play in MX Player</button>
                            <a class="btn-vlc" href="${vlcUrl}">VLC Player</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadSharedMovies();
    </script>
</body>
</html>
