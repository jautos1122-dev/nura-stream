<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NURA STREAMING</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; 
            outline: none; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #070a0f; 
            color: #fff; 
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* 1. CINEMATIC SPLASH INTRO (LIGHTWEIGHT - ZERO LAG) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #070a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }

        .splash-logo {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #e50914;
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.7);
        }

        .splash-sub {
            font-size: 13px;
            letter-spacing: 5px;
            color: #00d2ff;
            margin-top: 8px;
            text-transform: uppercase;
            font-weight: 800;
        }

        /* TOP NAVIGATION BAR */
        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 24px; 
            background: #0a0e17; 
            border-bottom: 1px solid #162030; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .logo { 
            font-size: 20px; 
            font-weight: 900; 
            color: #e50914; 
            letter-spacing: 1.5px; 
            margin-right: 20px;
        }
        .logo span { color: #00d2ff; }

        /* 4 CATEGORY BUTTONS ON TOP */
        .nav-categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-grow: 1;
        }
        .nav-categories::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: #111722;
            color: #94a3b8;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-btn.active {
            background: #e50914;
            color: #fff;
            border-color: #ffffff;
        }

        .nav-btn:focus {
            border-color: #ffffff !important;
            background: #e50914;
            color: #fff;
        }

        .add-btn { 
            background: #00d2ff; 
            color: #06090e; 
            border: 2px solid transparent; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: 900; 
            font-size: 13px; 
            cursor: pointer; 
            white-space: nowrap;
        }
        .add-btn:focus { 
            border-color: #ffffff !important; 
            background: #fff;
        }

        /* HEADER INFO */
        .section-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 24px 8px 24px; 
        }
        .section-title { font-size: 16px; font-weight: 800; color: #f1f5f9; }
        .section-count { font-size: 12px; color: #64748b; font-weight: 700; }

        /* MOVIE GRID: 4-5 COLUMNS ON TV, 2 ON MOBILE */
        .movie-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            padding: 8px 24px 40px 24px; 
        }

        @media (min-width: 650px) {
            .movie-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
        }

        @media (min-width: 950px) {
            .movie-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
        }

        @media (min-width: 1250px) {
            .movie-grid { grid-template-columns: repeat(5, 1fr); gap: 18px; }
        }

        /* HARDWARE ACCELERATED ZERO-LAG CARD */
        .movie-card { 
            background: #111722; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 3px solid transparent; 
            cursor: pointer;
            outline: none;
        }

        /* INSTANT WHITE BORDER FOCUS (NO DELAYS) */
        .movie-card:focus,
        .movie-card:hover {
            border-color: #ffffff !important;
            background: #162030;
        }

        .poster-box { 
            width: 100%; 
            height: 230px; 
            position: relative; 
            background: #141b26; 
        }
        
        .poster-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            pointer-events: none; 
        }

        .card-badge { 
            position: absolute; 
            top: 6px; 
            left: 6px; 
            background: #000; 
            color: #00d2ff; 
            font-size: 9px; 
            font-weight: 800; 
            padding: 2px 5px; 
            border-radius: 4px; 
            border: 1px solid #00d2ff; 
        }
        .card-year { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: #000; 
            color: #fff; 
            font-size: 9px; 
            font-weight: 700; 
            padding: 2px 5px; 
            border-radius: 4px; 
        }

        .movie-info { 
            padding: 8px 6px; 
            background: #111722;
            text-align: center;
        }
        .movie-name { 
            font-size: 13px; 
            font-weight: 700; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            color: #fff;
        }

        /* MODALS */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 100000; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
        }
        .modal.active { display: flex; }
        .modal-box { 
            background: #111722; 
            width: 100%; 
            max-width: 420px; 
            padding: 22px; 
            border-radius: 10px; 
            border: 1px solid #233044; 
        }
        .modal-box h3 { margin-bottom: 12px; color: #00d2ff; font-size: 16px; }
        .modal-box input, .modal-box select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            background: #080c13; 
            border: 1px solid #253347; 
            color: #fff; 
            border-radius: 6px; 
            font-size: 13px; 
        }
        
        .file-box { background: #080c13; border: 1px dashed #253347; padding: 10px; border-radius: 6px; margin-bottom: 10px; text-align: center; }
        .file-box label { font-size: 12px; color: #00d2ff; cursor: pointer; }
        .preview-img { width: 65px; height: 90px; object-fit: cover; border-radius: 4px; margin: 6px auto 0; display: none; }
        
        .save-btn { 
            width: 100%; 
            background: #e50914; 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 8px; 
            font-size: 14px; 
        }
        .cancel-btn { 
            width: 100%; 
            background: transparent; 
            color: #888; 
            border: 1px solid #253347; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }

        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #111722;
            border: 1px solid #e50914;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100000;
        }
    </style>
</head>
<body>

    <!-- 1. LIGHTWEIGHT CINEMATIC INTRO -->
    <div id="splash-screen">
        <div class="splash-logo">NURA</div>
        <div class="splash-sub">Streaming Service</div>
    </div>

    <!-- TOP NAVIGATION BAR -->
    <div class="navbar">
        <div class="logo">NURA <span>OTT</span></div>
        <div class="nav-categories">
            <button class="nav-btn active" id="btn-tamil" onclick="selectCategory('tamil')">Tamil Movies</button>
            <button class="nav-btn" id="btn-dubbed" onclick="selectCategory('dubbed')">Tamil Dubbed</button>
            <button class="nav-btn" id="btn-hollywood" onclick="selectCategory('hollywood')">Hollywood Dubbed</button>
            <button class="nav-btn" id="btn-series" onclick="selectCategory('series')">Web Series</button>
        </div>
        <button class="add-btn" id="btnAddMovie" onclick="openPasswordModal()">➕ Add Title</button>
    </div>

    <!-- SECTION TITLE & COUNT -->
    <div class="section-header">
        <div class="section-title" id="catTitle">🎬 Tamil Movies</div>
        <div class="section-count" id="movieCount">0 Titles</div>
    </div>

    <!-- CLEAN MULTI-ROW GRID -->
    <div class="movie-grid" id="movieContainer">
        <div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Loading catalog...</div>
    </div>

    <div id="toast"></div>

    <!-- PASSWORD MODAL (WORKS IN TV WEBVIEW) -->
    <div class="modal" id="passModal">
        <div class="modal-box" style="max-width: 320px; text-align: center;">
            <h3>🔒 Admin Security</h3>
            <p style="font-size: 12px; color: #8fa0b5; margin-bottom: 12px;">Enter 6-digit password:</p>
            <input type="password" id="adminPassInput" placeholder="Password" style="text-align: center; font-size: 18px; letter-spacing: 4px;" maxlength="10">
            <button class="save-btn" onclick="verifyAdminPassword()">Unlock</button>
            <button class="cancel-btn" onclick="closePasswordModal()">Cancel</button>
        </div>
    </div>

    <!-- ADD MOVIE MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3>🎬 Add New Title</h3>
            
            <label style="font-size: 11px; color: #888; margin-bottom: 4px; display: block;">Category:</label>
            <select id="mCategory">
                <option value="tamil">Tamil Movies</option>
                <option value="dubbed">Tamil Dubbed</option>
                <option value="hollywood">Hollywood Dubbed</option>
                <option value="series">Web Series</option>
            </select>

            <input type="text" id="mName" placeholder="Title (e.g. Jana Nayagan)" required>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="mYear" placeholder="Year" value="2024" style="flex: 1;">
                <select id="mQuality" style="flex: 1;">
                    <option value="4K UHD">4K UHD</option>
                    <option value="1080p FHD">1080p FHD</option>
                </select>
            </div>
            
            <div class="file-box">
                <label for="mFile">📁 Choose Poster from Gallery</label>
                <input type="file" id="mFile" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <center><img id="previewImg" class="preview-img"></center>
            </div>
            <input type="text" id="mPoster" placeholder="Or Poster Image URL (Optional)">

            <input type="text" id="mLink" placeholder="Magnet / Torrent Link (magnet:?...)" required>
            <button class="save-btn" onclick="saveMovie()">Save Title</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://nurastream-8f073-default-rtdb.firebaseio.com";
        let currentCategory = 'tamil';
        let allMoviesData = {};
        let uploadedPosterBase64 = "";

        // CINEMATIC SOUND
        function playCinematicSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                const bassOsc = ctx.createOscillator();
                const bassGain = ctx.createGain();
                bassOsc.type = 'sine';
                bassOsc.frequency.setValueAtTime(100, ctx.currentTime);
                bassOsc.frequency.exponentialRampToValueAtTime(28, ctx.currentTime + 2.5);

                bassGain.gain.setValueAtTime(1.0, ctx.currentTime);
                bassGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.8);

                bassOsc.connect(bassGain);
                bassGain.connect(ctx.destination);
                bassOsc.start();
                bassOsc.stop(ctx.currentTime + 2.8);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            playCinematicSound();

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.display = 'none';
                        const firstCard = document.querySelector('.movie-card');
                        if (firstCard) firstCard.focus();
                    }, 500);
                }
            }, 2500);

            loadMovies();
            setupDpadGrid();
        });

        // 2. HARDWARE-LEVEL D-PAD GRID ENGINE (ZERO-LAG TV REMOTE)
        function setupDpadGrid() {
            window.addEventListener('keydown', (e) => {
                const active = document.activeElement;
                if (!active) return;

                // Handle Navigation inside Movie Cards
                if (active.classList.contains('movie-card')) {
                    const cards = Array.from(document.querySelectorAll('.movie-card'));
                    const index = cards.indexOf(active);
                    if (index === -1) return;

                    const cols = getGridColumnCount();

                    // LEFT (37)
                    if (e.keyCode === 37) {
                        if (index > 0) {
                            e.preventDefault();
                            cards[index - 1].focus();
                        }
                    }
                    // RIGHT (39)
                    else if (e.keyCode === 39) {
                        if (index < cards.length - 1) {
                            e.preventDefault();
                            cards[index + 1].focus();
                        }
                    }
                    // UP (38)
                    else if (e.keyCode === 38) {
                        e.preventDefault();
                        if (index - cols >= 0) {
                            cards[index - cols].focus();
                        } else {
                            // Go to top Category Button
                            const activeCat = document.querySelector('.nav-btn.active');
                            if (activeCat) activeCat.focus();
                        }
                    }
                    // DOWN (40)
                    else if (e.keyCode === 40) {
                        e.preventDefault();
                        if (index + cols < cards.length) {
                            cards[index + cols].focus();
                        }
                    }
                }
                // Handle Navigation from Category Buttons
                else if (active.classList.contains('nav-btn')) {
                    if (e.keyCode === 40) { // DOWN
                        e.preventDefault();
                        const firstCard = document.querySelector('.movie-card');
                        if (firstCard) firstCard.focus();
                    }
                }
            });
        }

        function getGridColumnCount() {
            const w = window.innerWidth;
            if (w >= 1250) return 5;
            if (w >= 950) return 4;
            if (w >= 650) return 3;
            return 2;
        }

        // CATEGORY SWITCHING
        function selectCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + cat).classList.add('active');

            const titleElem = document.getElementById('catTitle');
            if (cat === 'tamil') titleElem.innerText = '🎬 Tamil Movies';
            else if (cat === 'dubbed') titleElem.innerText = '🎙️ Tamil Dubbed';
            else if (cat === 'hollywood') titleElem.innerText = '🍿 Hollywood Dubbed';
            else if (cat === 'series') titleElem.innerText = '📺 Web Series';

            renderMovies();
        }

        // PASSWORD MODAL
        function openPasswordModal() {
            document.getElementById('adminPassInput').value = '';
            document.getElementById('passModal').classList.add('active');
            setTimeout(() => { document.getElementById('adminPassInput').focus(); }, 100);
        }

        function closePasswordModal() {
            document.getElementById('passModal').classList.remove('active');
        }

        function verifyAdminPassword() {
            const val = document.getElementById('adminPassInput').value.trim();
            if (val === "420420") {
                closePasswordModal();
                openModal();
            } else {
                showToast("❌ Incorrect Password!");
                document.getElementById('adminPassInput').value = '';
                document.getElementById('adminPassInput').focus();
            }
        }

        document.getElementById('adminPassInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifyAdminPassword();
        });

        function openModal() { 
            document.getElementById('mCategory').value = currentCategory;
            document.getElementById('addModal').classList.add('active'); 
        }
        function closeModal() { 
            document.getElementById('addModal').classList.remove('active'); 
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    uploadedPosterBase64 = evt.target.result;
                    const preview = document.getElementById('previewImg');
                    preview.src = uploadedPosterBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function fetchAutoPoster(title) {
            try {
                const cleanTitle = title.replace(/\(.*?\)/g, '').trim();
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&media=movie&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x900bb');
                }
            } catch(e) {}
            return "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80";
        }

        async function loadMovies() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/movies.json?nocache=` + Date.now());
                allMoviesData = await res.json() || {};
                renderMovies();
            } catch (err) {
                console.error(err);
            }
        }

        async function saveMovie() {
            const category = document.getElementById('mCategory').value;
            const name = document.getElementById('mName').value.trim();
            const year = document.getElementById('mYear').value.trim() || '2024';
            const quality = document.getElementById('mQuality').value;
            let poster = uploadedPosterBase64 || document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("Please enter Title and Magnet Link!");
                return;
            }

            if (!poster) {
                poster = await fetchAutoPoster(name);
            }

            const movieId = 'm_' + Date.now();
            const movieData = { id: movieId, category: category || 'tamil', name, year, quality, poster, link, date: Date.now() };

            await fetch(`${FIREBASE_DB_URL}/movies/${movieId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movieData)
            });

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            document.getElementById('previewImg').style.display = 'none';
            uploadedPosterBase64 = "";
            closeModal();
            loadMovies();
            showToast("🎉 Title Added Successfully!");
        }

        async function deleteMovie(id, name) {
            if (confirm(`Do you want to delete "${name}"?`)) {
                await fetch(`${FIREBASE_DB_URL}/movies/${id}.json`, { method: 'DELETE' });
                showToast("Title Deleted.");
                loadMovies();
            }
        }

        function playMovie(magnetLink) {
            if (!magnetLink) return;
            window.location.href = magnetLink.trim();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // RENDER MOVIES UNDER CURRENT CATEGORY
        function renderMovies() {
            const container = document.getElementById('movieContainer');
            const countElem = document.getElementById('movieCount');
            container.innerHTML = '';

            const list = Object.values(allMoviesData || {}).filter(m => {
                const cat = m.category || 'tamil';
                return cat === currentCategory;
            }).sort((a,b) => (b.date || 0) - (a.date || 0));

            countElem.innerText = `${list.length} Titles`;

            if (list.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">No titles in this category. Click "➕ Add Title" to add!</div>';
                return;
            }

            list.forEach((m) => {
                const magnet = m.link.trim();
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.tabIndex = 0;

                card.innerHTML = `
                    <div class="poster-box">
                        <span class="card-badge">${m.quality || '4K UHD'}</span>
                        <span class="card-year">${m.year || '2024'}</span>
                        <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80'" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="movie-name">${m.name}</div>
                    </div>
                `;

                // 2.5s SAFE LONG PRESS DELETE & INSTANT PLAY
                let pressTimer = null;
                let isLongPress = false;

                const startHold = () => {
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        deleteMovie(m.id, m.name);
                    }, 2500);
                };

                const cancelHold = () => {
                    clearTimeout(pressTimer);
                };

                card.addEventListener('mousedown', startHold);
                card.addEventListener('mouseup', cancelHold);
                card.addEventListener('touchstart', startHold, { passive: true });
                card.addEventListener('touchend', cancelHold);

                card.addEventListener('keydown', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        if (!pressTimer) startHold();
                    }
                });

                card.addEventListener('keyup', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        cancelHold();
                        if (!isLongPress) playMovie(magnet);
                    }
                });

                card.addEventListener('click', () => {
                    if (!isLongPress) playMovie(magnet);
                });

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
