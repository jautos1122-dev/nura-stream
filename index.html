<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA STREAM</title>
    <!-- GunDB Realtime Cloud Sync (Zero Setup Instant Cloud) -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding-bottom: 80px; }
        
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #07090c; border-bottom: 1px solid #1a2230; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 2px; }
        .logo span { color: #00d2ff; }
        .add-btn { background: #00d2ff; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }

        .form-box { display: none; background: #131a24; padding: 18px; margin: 16px; border-radius: 10px; border: 1px solid #232d3d; }
        .form-box.active { display: block; }
        .form-box h3 { margin-bottom: 14px; color: #00d2ff; font-size: 16px; }
        .form-box input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0b0e14; border: 1px solid #2a3547; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        .form-box .submit-btn { width: 100%; background: #e50914; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }

        .section-title { font-size: 17px; font-weight: 700; margin: 20px 16px 12px; color: #00d2ff; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding: 0 16px; }
        
        .movie-card { background: #131a24; border-radius: 10px; overflow: hidden; border: 1px solid #232d3d; position: relative; }
        .poster-box { width: 100%; height: 200px; background: #1a2332; position: relative; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .delete-btn { position: absolute; top: 6px; right: 6px; background: rgba(229, 9, 20, 0.85); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; font-size: 13px; cursor: pointer; z-index: 10; }
        
        .movie-info { padding: 8px 10px; }
        .movie-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-stream { display: block; width: 100%; background: #e50914; color: #fff; text-align: center; text-decoration: none; font-size: 12px; font-weight: bold; padding: 8px 0; border-radius: 6px; margin-top: 8px; cursor: pointer; border: none; }

        /* TV & Web Player Modal */
        .player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        .player-modal.active { display: flex; }
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #111; border-bottom: 1px solid #222; }
        .close-player { background: #e50914; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        iframe { width: 100%; height: 100%; border: none; flex: 1; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NURA <span>STREAM</span></div>
        <button class="add-btn" onclick="toggleForm()">➕ Add Movie</button>
    </div>

    <!-- Movie Add Form -->
    <div class="form-box" id="movieForm">
        <h3>🎬 புதிய படத்தை சேர்க்க (டிவியிலும் உடனே வந்துவிடும்)</h3>
        <input type="text" id="mName" placeholder="படத்தின் பெயர் (எ.கா: இதயம் முரளி, Leo, Amaran)" required>
        <input type="text" id="mPoster" placeholder="போஸ்டர் இமேஜ் லிங்க் (ஆப்ஷனல்)">
        <input type="text" id="mLink" placeholder="TamilMV Magnet Link (magnet:?...)" required>
        <button class="submit-btn" onclick="addNewMovie()">Save to TV & Mobile</button>
    </div>

    <div class="section-title">🍿 My Shared Cinema (டிவி & மொபைல்)</div>
    <div class="movie-grid" id="movieContainer">
        <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 30px;">லோட் ஆகிறது... தயவுசெய்து காத்திருக்கவும்.</div>
    </div>

    <!-- TV Player Modal -->
    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <span id="playingTitle" style="font-weight: bold; color: #00d2ff;">Playing...</span>
            <button class="close-player" onclick="closePlayer()">✕ Close</button>
        </div>
        <iframe id="streamFrame" allowfullscreen></iframe>
    </div>

    <script>
        // Realtime Global Database Sync between Phone & TV
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const moviesDB = gun.get('nura_stream_jautos_movies_v1');
        let currentMovies = {};

        function toggleForm() {
            document.getElementById('movieForm').classList.toggle('active');
        }

        function addNewMovie() {
            const name = document.getElementById('mName').value.trim();
            let poster = document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("படத்தின் பெயர் மற்றும் Magnet Link உள்ளிடவும்!");
                return;
            }

            if (!poster) {
                poster = "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80";
            }

            const id = 'm_' + Date.now();
            moviesDB.get(id).put({
                id: id,
                name: name,
                poster: poster,
                link: link,
                deleted: false
            });

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            toggleForm();
        }

        function deleteMovie(id) {
            if (confirm("இந்தப் படத்தை நீக்கவா? (டிவியிலும் நீங்கிவிடும்)")) {
                moviesDB.get(id).put({ deleted: true });
            }
        }

        function openTVPlayer(title, magnetLink) {
            const modal = document.getElementById('playerModal');
            const frame = document.getElementById('streamFrame');
            const pTitle = document.getElementById('playingTitle');

            pTitle.innerText = "Playing: " + title;
            frame.src = "https://instant.io/#" + encodeURIComponent(magnetLink);
            modal.classList.add('active');
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const frame = document.getElementById('streamFrame');
            frame.src = "";
            modal.classList.remove('active');
        }

        // Realtime Sync Listener: Triggered automatically on TV whenever Phone updates
        moviesDB.map().on(function(data, id) {
            if (!data) return;
            if (data.deleted) {
                delete currentMovies[id];
            } else {
                currentMovies[id] = data;
            }
            render();
        });

        function render() {
            const container = document.getElementById('movieContainer');
            const list = Object.values(currentMovies);
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 10px;">படங்கள் எதுவும் இல்லை. மொபைலில் "➕ Add Movie" மூலம் சேர்த்தால் உடனே டிவியில் தோன்றும்!</div>';
                return;
            }

            list.reverse().forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteMovie('${m.id}')">✕</button>
                    <div class="poster-box">
                        <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80'">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${m.name}</div>
                        <button class="btn-stream" onclick="openTVPlayer('${m.name.replace(/'/g, "\\'")}', '${m.link.replace(/'/g, "\\'")}')">▶ Play Now</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
