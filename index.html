<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nura Streaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            outline: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. NETFLIX CINEMATIC SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1f0505 0%, #050505 90%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .splash-logo {
            font-size: 82px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #E50914;
            text-shadow: 0 0 35px rgba(229, 9, 20, 0.9), 0 0 70px rgba(229, 9, 20, 0.5);
            animation: netflixZoom 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .splash-sub {
            font-size: 15px;
            letter-spacing: 5px;
            color: #ffffff;
            margin-top: 12px;
            opacity: 0;
            animation: fadeInSub 1.4s ease 0.6s forwards;
            text-transform: uppercase;
        }

        @keyframes netflixZoom {
            0% { transform: scale(0.5); opacity: 0; filter: blur(12px); }
            50% { opacity: 1; filter: blur(0px); }
            100% { transform: scale(1.08); opacity: 1; }
        }

        @keyframes fadeInSub {
            to { opacity: 0.85; transform: translateY(-4px); }
        }

        /* HEADER & TOP BAR */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 36px;
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, transparent 100%);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            color: #E50914;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: #fff;
            font-size: 12px;
            background: #E50914;
            padding: 2px 7px;
            border-radius: 4px;
        }

        /* ADD MOVIE SECTION (INPUTS) */
        .add-box {
            display: flex;
            gap: 10px;
            padding: 12px 36px;
            background: rgba(20, 20, 25, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
        }

        .add-box input {
            background: #151821;
            border: 1px solid #2a2e3d;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            flex: 1;
            min-width: 140px;
        }

        .add-box input:focus {
            border-color: #38bdf8;
        }

        .btn-add {
            background: #E50914;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-add:focus, .btn-add:hover {
            background: #ff1f2d;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.7);
        }

        /* MOVIES CONTAINER & ULTRA-FAST TV FOCUS */
        .category-title {
            font-size: 18px;
            font-weight: 700;
            padding: 18px 36px 8px 36px;
            color: #e5e5e5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            padding: 12px 36px 60px 36px;
            will-change: transform;
        }

        .movie-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #141414;
            cursor: pointer;
            outline: none;
            border: 3px solid transparent;
            transform: scale(1);
            transition: transform 0.12s ease-out, border-color 0.12s ease-out, box-shadow 0.12s ease-out;
            will-change: transform;
        }

        /* 3. NETFLIX/PRIME WHITE FOCUS FRAME (SUPER FAST D-PAD) */
        .movie-card:focus,
        .movie-card:hover {
            transform: scale(1.08) translateY(-4px);
            border-color: #ffffff !important;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.4), 0 0 15px rgba(229, 9, 20, 0.6);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            pointer-events: none;
            background: #181818;
        }

        .movie-info {
            padding: 8px 10px;
            background: linear-gradient(180deg, transparent 0%, #111 85%);
        }

        .movie-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .movie-quality {
            font-size: 10px;
            color: #46d369;
            font-weight: bold;
            margin-top: 3px;
        }

        /* TOAST NOTIFICATION */
        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #E50914;
            color: #fff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- 1. NETFLIX INTRO ANIMATION -->
    <div id="splash-screen">
        <div class="splash-logo">NURA</div>
        <div class="splash-sub">Streaming Service</div>
    </div>

    <header>
        <div class="brand-logo">NURA <span>OTT</span></div>
        <div style="color: #888; font-size: 11px;">டிவி ரிமோட்: <span style="color:#fff;">OK</span> தொட்டால் Play | <span style="color:#ff4444;">Long Press</span> செய்தால் Delete</div>
    </header>

    <!-- புதிய படம் சேர்க்கும் பகுதி -->
    <div class="add-box">
        <input type="text" id="mTitle" placeholder="படத்தின் பெயர் (Title)">
        <input type="text" id="mPoster" placeholder="போஸ்டர் லிங்க் (Image URL - Optional)">
        <input type="text" id="mMagnet" placeholder="மேக்னட் / டோரண்ட் லிங்க் (magnet:?xt=...)">
        <button class="btn-add" onclick="addNewMovie()">+ சேர்க்க</button>
    </div>

    <div class="category-title">🎬 அண்மையில் சேர்க்கப்பட்டவை</div>
    <div class="movies-grid" id="moviesGrid"></div>

    <div id="toast"></div>

    <script>
        let movies = [];

        window.addEventListener('DOMContentLoaded', () => {
            // Splash Animation மறைத்தல் (2.2 வினாடி)
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.visibility = 'hidden';
                        const firstCard = document.querySelector('.movie-card');
                        if (firstCard) firstCard.focus();
                    }, 800);
                }
            }, 2200);

            loadSavedMovies();
        });

        // திரைப்படங்களை லோட் செய்யும் முறை (முழுக் கட்டுப்பாடு)
        async function loadSavedMovies() {
            let list = [];

            // 1. LocalStorage-ல் நீங்கள் முன்பு சேமித்த பழைய படங்கள்
            try {
                const local = localStorage.getItem('nura_movies') || 
                              localStorage.getItem('movies') || 
                              localStorage.getItem('movies_list');
                if (local) {
                    const parsed = JSON.parse(local);
                    if (Array.isArray(parsed) && parsed.length > 0) list = parsed;
                }
            } catch (e) {}

            // 2. movies.json ஃபைல் இருந்தால் அதையும் இணைத்தல்
            try {
                const res = await fetch('movies.json?t=' + Date.now());
                if (res.ok) {
                    const jsonM = await res.json();
                    if (Array.isArray(jsonM) && jsonM.length > 0) {
                        const merged = [...list, ...jsonM];
                        list = Array.from(new Map(merged.map(item => [item.magnet || item.url || item.title || item.name, item])).values());
                    }
                }
            } catch (e) {}

            movies = list;
            renderMovies();
        }

        function renderMovies() {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            if (!movies || movies.length === 0) {
                grid.innerHTML = '<div style="padding: 30px; color: #777; font-size: 14px;">படங்கள் எதுவும் இல்லை. மேலே உள்ள பெட்டியில் மேக்னட் லிங்கைச் சேர்த்து "+ சேர்க்க" பட்டனை அழுத்தவும்.</div>';
                return;
            }

            movies.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.tabIndex = 0; // டிவி ரிமோட் போகஸ் பெற

                const title = movie.title || movie.name || "திரைப்படம்";
                const poster = movie.poster || movie.image || movie.img || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80';
                const magnet = movie.magnet || movie.url || movie.link || "";

                card.innerHTML = `
                    <img src="${poster}" alt="${title}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80'" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-quality">4K UHD • HDR</div>
                    </div>
                `;

                // 1. கிளிக் / என்டர் அழுத்தினால் பழையபடி Stremio-வில் ப்ளே ஆகுதல்
                card.addEventListener('click', () => {
                    playMovie(magnet);
                });

                // 2. தவறுதலாக அழியாமல் இருக்க 2.5 நொடிகள் லாங் பிரஸ் (Long Press Safe Delete)
                let pressTimer = null;
                let isLongPress = false;

                const startHold = () => {
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        deleteMovieConfirm(title, index);
                    }, 2500);
                };

                const cancelHold = () => {
                    clearTimeout(pressTimer);
                };

                card.addEventListener('mousedown', startHold);
                card.addEventListener('mouseup', cancelHold);
                card.addEventListener('touchstart', startHold, { passive: true });
                card.addEventListener('touchend', cancelHold);

                // டிவி ரிமோட் OK பட்டன் இயக்கம்
                card.addEventListener('keydown', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        if (!pressTimer) startHold();
                    }
                });

                card.addEventListener('keyup', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        cancelHold();
                        if (!isLongPress) {
                            playMovie(magnet);
                        }
                    }
                });

                grid.appendChild(card);
            });
        }

        // அசல் ப்ளேயிங் வழிமுறை (Stremio / VLC நேரடி Intent)
        function playMovie(magnet) {
            if (!magnet) {
                showToast("⚠️ மேக்னட் லிங்க் கிடைக்கவில்லை!");
                return;
            }
            showToast("🚀 திரைப்படம் Stremio மூலம் திறக்கப்படுகிறது...");
            window.location.href = magnet;
        }

        // லாங் பிரஸ் செய்த பின் மட்டுமே நீக்குதல்
        function deleteMovieConfirm(title, index) {
            const confirmDel = confirm(`"${title}" திரைப்படத்தை நீக்க விரும்புகிறீர்களா?`);
            if (confirmDel) {
                movies.splice(index, 1);
                saveToLocalStorage();
                renderMovies();
                showToast("✅ திரைப்படம் நீக்கப்பட்டது.");
            }
        }

        // புதிய மேக்னட் படம் சேர்த்தல்
        function addNewMovie() {
            const titleInput = document.getElementById('mTitle');
            const posterInput = document.getElementById('mPoster');
            const magnetInput = document.getElementById('mMagnet');

            const title = titleInput.value.trim();
            const poster = posterInput.value.trim();
            const magnet = magnetInput.value.trim();

            if (!title || !magnet) {
                showToast("⚠️ படத்தின் பெயரையும் மேக்னட் லிங்கையும் உள்ளிடவும்!");
                return;
            }

            const newMovie = {
                title: title,
                poster: poster || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80',
                magnet: magnet
            };

            movies.unshift(newMovie);
            saveToLocalStorage();
            renderMovies();

            titleInput.value = '';
            posterInput.value = '';
            magnetInput.value = '';
            showToast("🎉 புதிய படம் வெற்றிகரமாகச் சேர்க்கப்பட்டது!");
        }

        function saveToLocalStorage() {
            localStorage.setItem('nura_movies', JSON.stringify(movies));
            localStorage.setItem('movies', JSON.stringify(movies));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }
    </script>
</body>
</html>
