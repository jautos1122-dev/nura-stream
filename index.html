<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nura Streaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            outline: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. NETFLIX STYLE SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a0808 0%, #000000 90%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-logo {
            font-size: 85px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #E50914;
            text-shadow: 0 0 35px rgba(229, 9, 20, 0.8), 0 0 70px rgba(229, 9, 20, 0.4);
            animation: netflixIntro 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .splash-sub {
            font-size: 16px;
            letter-spacing: 6px;
            color: #ffffff;
            margin-top: 10px;
            opacity: 0;
            animation: fadeInSub 1.5s ease 0.6s forwards;
            text-transform: uppercase;
        }

        @keyframes netflixIntro {
            0% {
                transform: scale(0.6);
                opacity: 0;
                filter: brightness(0.5) blur(10px);
            }
            50% {
                opacity: 1;
                filter: brightness(1.3) blur(0px);
            }
            100% {
                transform: scale(1.1);
                opacity: 1;
                filter: brightness(1);
            }
        }

        @keyframes fadeInSub {
            to {
                opacity: 0.8;
                transform: translateY(-5px);
            }
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 45px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            color: #E50914;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: #fff;
            font-size: 14px;
            background: #E50914;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 6px 14px;
        }

        .search-container input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 4px 8px;
            font-size: 14px;
        }

        /* MOVIES CONTAINER & ULTRA-FAST TV FOCUS */
        .category-title {
            font-size: 20px;
            font-weight: bold;
            padding: 10px 45px;
            color: #e5e5e5;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
            padding: 10px 45px 60px 45px;
            will-change: transform;
        }

        .movie-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #141414;
            cursor: pointer;
            outline: none;
            border: 3px solid transparent;
            transform: scale(1);
            transition: transform 0.15s ease-out, border-color 0.15s ease-out, box-shadow 0.15s ease-out;
            will-change: transform;
        }

        /* 3. NETFLIX/PRIME WHITE FOCUS FRAME */
        .movie-card:focus,
        .movie-card:hover {
            transform: scale(1.08) translateY(-4px);
            border-color: #ffffff !important;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.35), 0 0 15px rgba(229, 9, 20, 0.5);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .movie-info {
            padding: 10px;
            background: linear-gradient(180deg, transparent 0%, #111 80%);
        }

        .movie-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .movie-quality {
            font-size: 10px;
            color: #46d369;
            font-weight: bold;
            margin-top: 4px;
        }

        /* TOAST FOR LONG PRESS NOTICE */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #E50914;
            color: #fff;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- 1. NETFLIX INTRO ANIMATION -->
    <div id="splash-screen">
        <div class="splash-logo">NURA</div>
        <div class="splash-sub">Streaming Service</div>
    </div>

    <header>
        <div class="brand-logo">NURA <span>OTT</span></div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="திரைப்படங்களைத் தேடுக..." onkeyup="filterMovies()">
        </div>
    </header>

    <div class="category-title">🎬 அண்மையில் சேர்க்கப்பட்டவை</div>
    <div class="movies-grid" id="moviesGrid"></div>

    <div id="toast"></div>

    <script>
        // Splash Screen Hide after 2.4s
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                    // Focus first movie card automatically for TV remote
                    const firstCard = document.querySelector('.movie-card');
                    if (firstCard) firstCard.focus();
                }, 800);
            }, 2400);
            loadMovies();
        });

        let allMovies = [];

        async function loadMovies() {
            try {
                const res = await fetch('movies.json?t=' + Date.now());
                allMovies = await res.json();
                renderMovies(allMovies);
            } catch (e) {
                console.error("Error loading movies:", e);
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            movies.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.tabIndex = 0; // Enables TV Remote Focus

                card.innerHTML = `
                    <img src="${movie.poster || 'https://via.placeholder.com/300x450?text=No+Poster'}" alt="${movie.title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-quality">4K UHD • HDR</div>
                    </div>
                `;

                // Single Click: Play via Stremio Magnet Intent
                card.addEventListener('click', () => {
                    playMovie(movie.magnet);
                });

                // 2. LONG PRESS TO DELETE (3 SECONDS) - Safe for TV
                let pressTimer = null;
                let isLongPress = false;

                const startPress = () => {
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        confirmDelete(movie.title, index);
                    }, 2500); // 2.5 seconds hold
                };

                const cancelPress = () => {
                    clearTimeout(pressTimer);
                };

                // Mouse / Touch Events
                card.addEventListener('mousedown', startPress);
                card.addEventListener('mouseup', cancelPress);
                card.addEventListener('touchstart', startPress, { passive: true });
                card.addEventListener('touchend', cancelPress);

                // TV Remote 'OK' Button Handling (Keycode 13 / Center D-Pad)
                card.addEventListener('keydown', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        if (!pressTimer) {
                            startPress();
                        }
                    }
                });

                card.addEventListener('keyup', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        cancelPress();
                        if (!isLongPress) {
                            playMovie(movie.magnet);
                        }
                    }
                });

                grid.appendChild(card);
            });
        }

        function playMovie(magnet) {
            if (!magnet) {
                showToast("வீடியோ லிங்க் கிடைக்கவில்லை!");
                return;
            }
            // Stremio / TV Intent Launcher
            window.location.href = magnet;
        }

        function confirmDelete(title, index) {
            const ok = confirm(`"${title}" திரைப்படத்தை நீக்க விரும்புகிறீர்களா?`);
            if (ok) {
                allMovies.splice(index, 1);
                renderMovies(allMovies);
                showToast("திரைப்படம் வெற்றிகரமாக நீக்கப்பட்டது.");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function filterMovies() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(q));
            renderMovies(filtered);
        }
    </script>
</body>
</html>
