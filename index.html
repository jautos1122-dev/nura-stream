<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NURA STREAMING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; outline: none; user-select: none; }
        body { background: #06090e; color: #fff; padding-bottom: 60px; overflow-x: hidden; }

        /* 1. CINEMATIC SPLASH INTRO (4 SECONDS) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #260505 0%, #06090e 90%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .splash-logo {
            font-size: 88px;
            font-weight: 900;
            letter-spacing: 7px;
            color: #e50914;
            text-shadow: 0 0 35px rgba(229, 9, 20, 0.9), 0 0 75px rgba(229, 9, 20, 0.5);
            animation: netflixZoom 3.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .splash-sub {
            font-size: 15px;
            letter-spacing: 5px;
            color: #00d2ff;
            margin-top: 12px;
            opacity: 0;
            animation: fadeInSub 2.2s ease 0.8s forwards;
            text-transform: uppercase;
            font-weight: 800;
        }

        @keyframes netflixZoom {
            0% { transform: scale(0.5); opacity: 0; filter: blur(14px); }
            40% { opacity: 1; filter: blur(0px); }
            85% { opacity: 1; transform: scale(1.08); }
            100% { transform: scale(1.12); opacity: 0.9; }
        }

        @keyframes fadeInSub {
            to { opacity: 0.9; transform: translateY(-4px); }
        }

        /* TOP NAVIGATION */
        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 14px 28px; 
            background: rgba(6, 9, 14, 0.96); 
            border-bottom: 1px solid #162030; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            backdrop-filter: blur(12px); 
        }

        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 2px; }
        .logo span { color: #00d2ff; }

        .nav-categories {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: #111722;
            color: #8fa0b5;
            border: 1px solid #233044;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease;
        }

        .nav-btn:hover, .nav-btn:focus, .nav-btn.active {
            background: #e50914;
            color: #fff;
            border-color: #ffffff;
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.6);
            transform: scale(1.05);
        }

        .add-btn { 
            background: #00d2ff; 
            color: #06090e; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-weight: 800; 
            font-size: 13px; 
            cursor: pointer; 
        }
        .add-btn:focus, .add-btn:hover { background: #fff; box-shadow: 0 0 10px #00d2ff; transform: scale(1.05); }

        /* HERO BANNER */
        .hero-banner { 
            width: 100%; 
            height: 180px; 
            background: linear-gradient(180deg, rgba(6,9,14,0.3) 0%, #06090e 100%), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 18px 28px; 
        }
        .hero-tag { color: #00d2ff; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 4px; }
        .hero-title { font-size: 22px; font-weight: 900; line-height: 1.2; }
        .hero-title span { color: #e50914; }

        /* CATALOG TITLE */
        .catalog-title { 
            font-size: 17px; 
            font-weight: 800; 
            margin: 16px 28px 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* MOVIE GRID & ULTRA-FAST SMOOTH FOCUS */
        .movie-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 16px; 
            padding: 0 28px; 
            will-change: transform; 
        }

        .movie-card { 
            background: #111722; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 3px solid transparent; 
            position: relative; 
            cursor: pointer;
            outline: none;
            transform: scale(1);
            transition: transform 0.12s cubic-bezier(0.2, 0, 0.2, 1), border-color 0.12s ease-out, box-shadow 0.12s ease-out;
            will-change: transform;
        }

        /* WHITE FOCUS BORDER (NETFLIX/PRIME STYLE) */
        .movie-card:focus,
        .movie-card:hover {
            transform: scale(1.08) translateY(-4px);
            border-color: #ffffff !important;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.45), 0 0 15px rgba(229, 9, 20, 0.6);
            z-index: 10;
        }

        .poster-box { width: 100%; height: 220px; position: relative; background: #162030; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .card-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #00d2ff; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; border: 1px solid #00d2ff; }
        .card-year { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85); color: #fff; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }

        .movie-info { 
            padding: 10px 8px; 
            background: linear-gradient(180deg, transparent 0%, #111722 80%);
            text-align: center;
        }
        .movie-name { 
            font-size: 13px; 
            font-weight: 700; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            color: #fff;
        }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-box { background: #111722; width: 100%; max-width: 440px; padding: 20px; border-radius: 12px; border: 1px solid #233044; }
        .modal-box h3 { margin-bottom: 12px; color: #00d2ff; font-size: 16px; }
        .modal-box input, .modal-box select { width: 100%; padding: 11px; margin-bottom: 10px; background: #080c13; border: 1px solid #253347; color: #fff; border-radius: 6px; font-size: 13px; outline: none; }
        .file-box { background: #080c13; border: 1px dashed #253347; padding: 10px; border-radius: 6px; margin-bottom: 10px; text-align: center; }
        .file-box label { font-size: 12px; color: #00d2ff; cursor: pointer; }
        .preview-img { width: 70px; height: 95px; object-fit: cover; border-radius: 4px; margin: 6px auto 0; display: none; }
        .save-btn { width: 100%; background: #e50914; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 6px; font-size: 14px; }
        .cancel-btn { width: 100%; background: transparent; color: #888; border: 1px solid #253347; padding: 9px; border-radius: 6px; cursor: pointer; }

        /* TOAST */
        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #e50914;
            color: #fff;
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <!-- 1. CINEMATIC SPLASH INTRO (4 SECONDS) -->
    <div id="splash-screen">
        <div class="splash-logo">NURA</div>
        <div class="splash-sub">Streaming Service</div>
    </div>

    <!-- TOP NAVIGATION -->
    <div class="navbar">
        <div class="logo">NURA <span>OTT</span></div>
        <div class="nav-categories">
            <button class="nav-btn active" id="btn-tamil" tabindex="0" onclick="switchCategory('tamil')">🎬 Tamil Movies</button>
            <button class="nav-btn" id="btn-dubbed" tabindex="0" onclick="switchCategory('dubbed')">🎙️ Tamil Dubbed</button>
            <button class="nav-btn" id="btn-hollywood" tabindex="0" onclick="switchCategory('hollywood')">🍿 Hollywood Dubbed</button>
            <button class="nav-btn" id="btn-series" tabindex="0" onclick="switchCategory('series')">📺 Web Series</button>
        </div>
        <button class="add-btn" tabindex="0" onclick="protectedOpenModal()">➕ Add Movie</button>
    </div>

    <!-- HERO BANNER -->
    <div class="hero-banner">
        <div class="hero-tag">🔥 4K ULTRA HD STREAMING</div>
        <div class="hero-title" id="bannerTitle">TAMIL <span>MOVIES</span></div>
    </div>

    <div class="catalog-title">
        <span id="categoryHeading">🎬 Tamil Movies Collection</span>
        <span id="movieCount" style="font-size: 12px; color: #888;">0 Titles</span>
    </div>

    <!-- MOVIE CARDS CONTAINER -->
    <div class="movie-grid" id="movieContainer">
        <div style="grid-column: 1/-1; text-align: center; color: #667; padding: 40px;">Loading Catalog...</div>
    </div>

    <div id="toast"></div>

    <!-- ADD MOVIE MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3>🎬 Add New Title</h3>
            
            <label style="font-size: 11px; color: #888; margin-bottom: 4px; display: block;">Category:</label>
            <select id="mCategory">
                <option value="tamil">🎬 Tamil Movies</option>
                <option value="dubbed">🎙️ Tamil Dubbed</option>
                <option value="hollywood">🍿 Hollywood Dubbed</option>
                <option value="series">📺 Web Series</option>
            </select>

            <input type="text" id="mName" placeholder="Movie Title (e.g. Jana Nayagan)" required>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="mYear" placeholder="Year" value="2024" style="flex: 1;">
                <select id="mQuality" style="flex: 1;">
                    <option value="4K UHD">4K UHD</option>
                    <option value="1080p FHD">1080p FHD</option>
                </select>
            </div>
            
            <div class="file-box">
                <label for="mFile">📁 Choose Poster from Gallery</label>
                <input type="file" id="mFile" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <center><img id="previewImg" class="preview-img"></center>
            </div>
            <input type="text" id="mPoster" placeholder="Or Poster Image URL (Optional)">

            <input type="text" id="mLink" placeholder="Magnet / Torrent Link (magnet:?...)" required>
            <button class="save-btn" onclick="saveMovie()">Save Title</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://nurastream-8f073-default-rtdb.firebaseio.com";
        let currentCategory = 'tamil';
        let allMoviesData = {};
        let uploadedPosterBase64 = "";

        // 1. FULL 4-SECOND CINEMATIC INTRO SOUND (Deep Sub Bass + Atmospheric Chime)
        function playCinematicSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                // Layer 1: Sub Bass Boom (4 Seconds long)
                const bassOsc = ctx.createOscillator();
                const bassGain = ctx.createGain();
                bassOsc.type = 'sine';
                bassOsc.frequency.setValueAtTime(105, ctx.currentTime);
                bassOsc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 3.8);

                bassGain.gain.setValueAtTime(1.0, ctx.currentTime);
                bassGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 4.0);

                bassOsc.connect(bassGain);
                bassGain.connect(ctx.destination);
                bassOsc.start();
                bassOsc.stop(ctx.currentTime + 4.0);

                // Layer 2: Atmospheric Netflix Chime
                const chimeOsc = ctx.createOscillator();
                const chimeGain = ctx.createGain();
                chimeOsc.type = 'triangle';
                chimeOsc.frequency.setValueAtTime(260, ctx.currentTime);
                chimeOsc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 3.5);

                chimeGain.gain.setValueAtTime(0.35, ctx.currentTime);
                chimeGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.8);

                chimeOsc.connect(chimeGain);
                chimeGain.connect(ctx.destination);
                chimeOsc.start();
                chimeOsc.stop(ctx.currentTime + 3.8);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            playCinematicSound();

            // Splash Screen Hide after 4 seconds
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.visibility = 'hidden';
                        const firstCard = document.querySelector('.movie-card');
                        if (firstCard) firstCard.focus();
                    }, 800);
                }
            }, 4000);

            loadMovies();
        });

        // 5. SECURE ADD MOVIE (PASSWORD: 420420)
        function protectedOpenModal() {
            const enteredPass = prompt("🔒 Enter Admin Password to add movie:");
            if (enteredPass === "420420") {
                openModal();
            } else if (enteredPass !== null) {
                showToast("❌ Incorrect Password! Access Denied.");
            }
        }

        function openModal() { 
            document.getElementById('mCategory').value = currentCategory;
            document.getElementById('addModal').classList.add('active'); 
        }
        function closeModal() { document.getElementById('addModal').classList.remove('active'); }

        // CATEGORY SWITCHING (4 CATEGORIES)
        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + cat).classList.add('active');

            const bannerTitle = document.getElementById('bannerTitle');
            const categoryHeading = document.getElementById('categoryHeading');

            if (cat === 'tamil') {
                bannerTitle.innerHTML = 'TAMIL <span>MOVIES</span>';
                categoryHeading.innerText = '🎬 Tamil Movies Collection';
            } else if (cat === 'dubbed') {
                bannerTitle.innerHTML = 'TAMIL <span>DUBBED</span>';
                categoryHeading.innerText = '🎙️ Tamil Dubbed Movies';
            } else if (cat === 'hollywood') {
                bannerTitle.innerHTML = 'HOLLYWOOD <span>DUBBED</span>';
                categoryHeading.innerText = '🍿 Hollywood Dubbed Collection';
            } else if (cat === 'series') {
                bannerTitle.innerHTML = 'WEB <span>SERIES</span>';
                categoryHeading.innerText = '📺 Web Series & Shows';
            }

            renderCurrentCategory();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    uploadedPosterBase64 = evt.target.result;
                    const preview = document.getElementById('previewImg');
                    preview.src = uploadedPosterBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function fetchAutoPoster(title) {
            try {
                const cleanTitle = title.replace(/\(.*?\)/g, '').trim();
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&media=movie&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x900bb');
                }
            } catch(e) {}
            return "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80";
        }

        async function loadMovies() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/movies.json?nocache=` + Date.now());
                allMoviesData = await res.json() || {};
                renderCurrentCategory();
            } catch (err) {
                console.error(err);
            }
        }

        async function saveMovie() {
            const category = document.getElementById('mCategory').value;
            const name = document.getElementById('mName').value.trim();
            const year = document.getElementById('mYear').value.trim() || '2024';
            const quality = document.getElementById('mQuality').value;
            let poster = uploadedPosterBase64 || document.getElementById('mPoster').value.trim();
            const link = document.getElementById('mLink').value.trim();

            if (!name || !link) {
                alert("Please enter Title and Magnet Link!");
                return;
            }

            if (!poster) {
                poster = await fetchAutoPoster(name);
            }

            const movieId = 'm_' + Date.now();
            const movieData = { id: movieId, category: category || 'tamil', name, year, quality, poster, link, date: Date.now() };

            await fetch(`${FIREBASE_DB_URL}/movies/${movieId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movieData)
            });

            document.getElementById('mName').value = '';
            document.getElementById('mPoster').value = '';
            document.getElementById('mLink').value = '';
            document.getElementById('previewImg').style.display = 'none';
            uploadedPosterBase64 = "";
            closeModal();
            loadMovies();
            showToast("🎉 Title Added Successfully!");
        }

        async function deleteMovie(id, name) {
            if (confirm(`Do you want to delete "${name}"?`)) {
                await fetch(`${FIREBASE_DB_URL}/movies/${id}.json`, { method: 'DELETE' });
                showToast("Title Deleted.");
                loadMovies();
            }
        }

        function playMovie(magnetLink) {
            if (!magnetLink) return;
            window.location.href = magnetLink.trim();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function renderCurrentCategory() {
            const container = document.getElementById('movieContainer');
            const countElem = document.getElementById('movieCount');
            container.innerHTML = '';

            const list = Object.values(allMoviesData || {}).filter(m => {
                const cat = m.category || 'tamil';
                return cat === currentCategory;
            }).sort((a,b) => (b.date || 0) - (a.date || 0));

            countElem.innerText = `${list.length} Titles`;

            if (list.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #667; padding: 40px;">No movies in this category yet. Click "➕ Add Movie" to upload!</div>';
                return;
            }

            list.forEach(m => {
                const magnet = m.link.trim();
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.tabIndex = 0; // Seamless TV Remote Focus

                card.innerHTML = `
                    <div class="poster-box">
                        <span class="card-badge">${m.quality || '4K UHD'}</span>
                        <span class="card-year">${m.year || '2024'}</span>
                        <img src="${m.poster}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80'" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="movie-name">${m.name}</div>
                    </div>
                `;

                // 2.5-SECOND SAFE LONG PRESS DELETE & INSTANT CLICK PLAY
                let pressTimer = null;
                let isLongPress = false;

                const startHold = () => {
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        deleteMovie(m.id, m.name);
                    }, 2500);
                };

                const cancelHold = () => {
                    clearTimeout(pressTimer);
                };

                card.addEventListener('mousedown', startHold);
                card.addEventListener('mouseup', cancelHold);
                card.addEventListener('touchstart', startHold, { passive: true });
                card.addEventListener('touchend', cancelHold);

                // TV Remote OK Button
                card.addEventListener('keydown', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        if (!pressTimer) startHold();
                    }
                });

                card.addEventListener('keyup', (e) => {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        cancelHold();
                        if (!isLongPress) {
                            playMovie(magnet);
                        }
                    }
                });

                // Direct Touch / Click
                card.addEventListener('click', () => {
                    if (!isLongPress) {
                        playMovie(magnet);
                    }
                });

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
